        #synergy-dock {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: min(94%, 460px);
    z-index: 60000;
    border-radius: 32px;
    background: rgba(5, 10, 21, 0.55);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-top: 1px solid rgba(0, 242, 254, 0.25);
    box-shadow: 0 20px 60px -10px rgba(0, 0, 0, 0.7), 0 0 40px rgba(0, 242, 254, 0.06);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom)) 8px;
}

#dock-trace {
    position: relative;
    height: 1px;
    margin: 0 20px 4px 20px;
    background: linear-gradient(90deg, transparent, rgba(0,242,254,0.15) 15%, rgba(0,242,254,0.15) 85%, transparent);
}
#dock-pulse {
    position: absolute;
    top: -2px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #00f2fe;
    box-shadow: 0 0 8px #00f2fe, 0 0 16px rgba(0,242,254,0.6);
    transition: left 0.45s cubic-bezier(0.65, 0, 0.35, 1);
}

#dock-items {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
}

.dock-node {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 2px;
    padding: 2px 0 0 0;
    cursor: pointer;
    background: none;
    border: none;
    position: relative;
}

.dock-icon-shell {
    width: 48px;
    height: 48px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: all 0.35s cubic-bezier(0.19, 1, 0.22, 1);
    background: transparent;
}

.dock-node svg {
    width: 24px;
    height: 24px;
    stroke: rgba(255,255,255,0.45);
    fill: none;
    stroke-width: 2;
    transition: all 0.3s ease;
}

.dock-label {
    font-family: 'Syncopate', sans-serif;
    font-size: 6.5px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    max-height: 0;
    opacity: 0;
    transform: translateY(-2px);
    transition: all 0.35s ease;
    overflow: hidden;
}

.dock-node.active .dock-icon-shell {
    background: rgba(0, 242, 254, 0.08);
    box-shadow: 0 0 0 1px rgba(0,242,254,0.25), 0 0 18px rgba(0,242,254,0.15);
    transform: translateY(-6px);
}
.dock-node.active svg { stroke: #00f2fe; }
.dock-node.active .dock-label {
    color: #00f2fe;
    max-height: 12px;
    opacity: 1;
    transform: translateY(0);
}

.dock-ring {
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    pointer-events: none;
}

.dock-live-dot {
    position: absolute;
    top: 2px;
    right: 2px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 6px #00ff88;
    border: 1.5px solid #050a15;
}

#profile-sheet-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(6px);
    z-index: 69999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
}
#profile-sheet-overlay.active { opacity: 1; pointer-events: auto; }

#profile-sheet {
    position: fixed;
    left: 50%;
    bottom: 0;
    transform: translate(-50%, 100%);
    width: min(94%, 460px);
    z-index: 70000;
    background: rgba(5, 10, 21, 0.97);
    border: 1px solid rgba(0,242,254,0.15);
    border-bottom: none;
    border-top: 2px solid #00f2fe;
    border-radius: 28px 28px 0 0;
    padding: 10px 20px calc(28px + env(safe-area-inset-bottom)) 20px;
    transition: transform 0.45s cubic-bezier(0.19, 1, 0.22, 1);
    box-shadow: 0 -20px 60px rgba(0,0,0,0.6);
}
#profile-sheet.active { transform: translate(-50%, 0); }

.sheet-handle {
    width: 36px; height: 4px;
    background: rgba(255,255,255,0.15);
    border-radius: 10px;
    margin: 8px auto 18px auto;
}

.sheet-item {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 6px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    cursor: pointer;
}
.sheet-item:last-child { border-bottom: none; }
.sheet-item svg { width: 18px; height: 18px; stroke: #00f2fe; fill: none; stroke-width: 2; }
.sheet-item span {

.sheet-item.danger svg { stroke: #f87171; }
.sheet-item.danger span { color: #f87171; }

body { padding-bottom: 90px; }

    <script>
    const firebaseConfig = { 
        apiKey: "AIzaSyDLTwLq8Le9vYAwRkRcqXPGxFnEqW1yE2E", 
        authDomain: "synergy-protocol.firebaseapp.com", 
        projectId: "synergy-protocol", 
        storageBucket: "synergy-protocol.firebasestorage.app", 
        messagingSenderId: "179647543031", 
        appId: "1:179647543031:web:388da8a36e1bbbb55d85f2" 
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();
    const currentActiveUser = localStorage.getItem('synergy_user');

    // Muna bukatar global variable domin adana bank details
    let userBankData = null;

    
     async function syncWalletData() {
    if (!currentActiveUser) { window.location.replace("signin.html"); return; }
    
    // 1. Saurari canjin bayanai a "users" (Earning da Approved Withdrawals)
    db.collection("users").doc(currentActiveUser).onSnapshot((userDoc) => {
        if (userDoc.exists) {
            
            // 2. A duk lokacin da kudi ya canza, ko kuma aka yi sabon withdrawal request, 
            // wannan "Inner Snapshot" din zai sake lissafa Pending Amount LIVE.
            db.collection("withdrawals")
              .where("userId", "==", currentActiveUser)
              .where("status", "==", "pending")
              .onSnapshot((pendingSnapshot) => {
                
                const data = userDoc.data();
                const vBal = data.videoBalance || 0;
                const sBal = data.shareBalance || 0;
                const totalEarned = vBal + sBal;
                const totalWithdrawn = data.totalWithdrawn || 0;

                let pendingAmount = 0;
                pendingSnapshot.forEach(w => {
                    pendingAmount += w.data().amount || 0;
                });

                // Lissafin Equity na gaskiya (Live Math)
                const availableEquity = totalEarned - totalWithdrawn - pendingAmount;

                // Update UI nan take ba tare da refresh ba
                const equityDisplay = document.getElementById('main-equity-display');
                if (equityDisplay) {
                    equityDisplay.innerHTML = `${availableEquity.toLocaleString()}<span class="text-gray-500 text-2xl ml-2">pts</span>`;
                }
                
                document.getElementById('total-earned-display').innerText = `${totalEarned.toLocaleString()} pts`;
                document.getElementById('withdrawn-display').innerText = `${totalWithdrawn.toLocaleString()} pts`;
                
                  // Update sauran ayyukan shafin
                updateTransactionHistory(data);
                controlWithdrawButton(data.isVerified, availableEquity);
            });

            // Adana bayanan banki
            userBankData = userDoc.data().bankDetails || null;
            if (userBankData) {
                document.getElementById('bank-name').value = userBankData.bankName || '';
                document.getElementById('account-number').value = userBankData.accountNumber || '';
                document.getElementById('account-name').value = userBankData.accountName || '';
            }
        }
    });
                     }
                    

      function controlWithdrawButton(isVerified, balance) {
    const btn = document.getElementById('withdraw-btn');
    if (!btn) return;

    if (isVerified === true) {
        btn.disabled = false; 
        btn.style.opacity = "1"; 
        btn.innerText = "Process Transaction";
        
        btn.onclick = async () => {
            if (!userBankData || !userBankData.accountNumber) {
                alert("Settlement required: Please update your bank details.");
                openWithdrawalModal();
                return;
            }

            const amountInput = document.getElementById('withdraw-amount');
            const amount = parseFloat(amountInput.value);

            if (!amount || amount <= 0) { alert("Please enter valid amount"); return; }
            if (amount > balance) { alert("Insufficient balance"); return; }
            if (amount < 100) { alert("Minimum.withdrawal: 100 pts"); return; }

            try {
                btn.disabled = true;
                btn.innerText = "Processing...";

                // A. Tura Withdrawal Request kawai zuwa Firebase (Wannan shi ne kadai ya kamata ya zama a nan)
                await db.collection("withdrawals").add({
                    userId: currentActiveUser,
                    amount: amount,
                    bankDetails: userBankData,
                    status: "pending",
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                // MUN CIRE 'totalWithdrawn update' DIN DA KE NAN DOMIN GUDEWA DOUBLE DEDUCTION
                
                alert(`Success: ${amount} pts request sent. It will reflect as pending.`);
                amountInput.value = ""; 
                btn.innerText = "Process Transaction";
                btn.disabled = false;
            } catch (error) {
                console.error("Firebase Error:", error);
                alert("System error: Transaction failed.");
                btn.innerText = "Process Transaction";
                btn.disabled = false;
            }
        };
    } else {
        btn.disabled = true; 
        btn.style.opacity = "0.3"; 
        btn.innerText = "Locked: Active nodes";
    }
                }
            

    async function updateTransactionHistory(userData) {
        const historyContainer = document.getElementById('history-list');
        if (!historyContainer) return;

        try {
            // Muna jawo dukkan withdrawals na wannan user ba tare da orderBy ba
            const snapshot = await db.collection("withdrawals")
                .where("userId", "==", currentActiveUser)
                .get();

            let withdrawals = [];
            snapshot.forEach(doc => {
                withdrawals.push({ id: doc.id, ...doc.data() });
            });

            // Mu da kanmu za mu jera su daga na kwanan nan (Manual Sorting)
            withdrawals.sort((a, b) => {
                const timeA = a.timestamp?.seconds || 0;
                const timeB = b.timestamp?.seconds || 0;
                return timeB - timeA;
            });

            let historyHTML = '';

            // A. Protocol Yield
            if (userData.videoBalance > 0 || userData.shareBalance > 0) {
                historyHTML += `
                    <div class="flex justify-between items-center py-3 border-b border-white/[0.03]">
                        <div>
                            <p class="text-[11px] font-medium text-gray-200">Protocol Yield</p>
                            <p class="text-[8px] text-gray-500 uppercase">Live Assets</p>
                        </div>
                        <div class="text-right">
                            <p class="digits-terminal text-[12px] text-green-400">+₦${(userData.videoBalance + userData.shareBalance).toLocaleString()}</p>
                            <span class="text-[7px] orbitron text-cyan-600">Active</span>
                        </div>
                    </div>`;
            }

            // B. Withdrawal Logs
            if (withdrawals.length > 0) {
                withdrawals.forEach(tx => {
                    let statusColor = "text-yellow-500";
                    if (tx.status === "approved") { statusColor = "text-green-500"; }
                    if (tx.status === "rejected") { statusColor = "text-red-500"; }

                    historyHTML += `
                        <div class="flex justify-between items-center py-4 border-b border-white/[0.02]">
                            <div>
                                <p class="text-[11px] font-medium text-white">Withdrawal Request</p>
                                <p class="text-[8px] text-gray-500 uppercase">${tx.bankDetails?.bankName || 'Asset Transfer'}</p>
                            </div>
                            <div class="text-right">
                                <p class="digits-terminal text-[11px] ${statusColor}">-₦${tx.amount.toLocaleString()}</p>
                                <span class="text-[7px] orbitron font-bold ${statusColor}">${tx.status.toUpperCase()}</span>
                            </div>
                        </div>`;
                });
            } else {
                if (historyHTML === '') {
                    historyHTML = '<p class="text-center text-[10px] text-gray-600 uppercase py-8">No transaction logs</p>';
                }
            }

            historyContainer.innerHTML = historyHTML;

        } catch (error) {
            console.error("History Error:", error);
            historyContainer.innerHTML = '<p class="text-center text-[9px] text-gray-700 uppercase py-4">Synchronizing Ledger...</p>';
        }
    }
        
        

    function openWithdrawalModal() { document.getElementById('withdrawal-modal').classList.remove('hidden'); }
    function closeWithdrawalModal() { document.getElementById('withdrawal-modal').classList.add('hidden'); }

    async function saveWithdrawalDetails() {
        const bank = document.getElementById('bank-name').value;
        const accNum = document.getElementById('account-number').value;
        const accName = document.getElementById('account-name').value;
        if (!bank || !accNum || !accName) { alert("Please fill all settlement fields!"); return; }

        try {
            await db.collection("users").doc(currentActiveUser).update({
                bankDetails: { bankName: bank, accountNumber: accNum, accountName: accName, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }
            });
            alert("Settlement details succeed!");
            closeWithdrawalModal();
        } catch (error) { alert("System Error. Try again."); }
    }

    function toggleGoogleMenu(event) {
        event.stopPropagation();
        document.getElementById('google-nav').classList.toggle('active');
    }

    window.onclick = function() {
        const menu = document.getElementById('google-nav');
        if (menu && menu.classList.contains('active')) {
            menu.classList.remove('active');
        }
    };

    syncWalletData();

       function setDockActive(index) {
    document.querySelectorAll('.dock-node').forEach(n => n.classList.remove('active'));
    const node = document.querySelector(`.dock-node[data-index="${index}"]`);
    if (node) node.classList.add('active');

    const pulse = document.getElementById('dock-pulse');
    const positions = [10, 30, 50, 70, 90];
    if (pulse) pulse.style.left = `calc(${positions[index]}% - 2.5px)`;
}

function scrollToTasks() {
    const el = document.getElementById('synergy-nodes-wrapper');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function openProfileSheet() {
    document.getElementById('profile-sheet-overlay').classList.add('active');
    document.getElementById('profile-sheet').classList.add('active');
}
function closeProfileSheet() {
    document.getElementById('profile-sheet-overlay').classList.remove('active');
    document.getElementById('profile-sheet').classList.remove('active');
    setDockActive(-1);
}

function updateDockTaskRing(watched, limit = 5) {
    const circle = document.getElementById('task-ring-progress');
    const label = document.getElementById('task-dock-label');
    if (!circle) return;
    const circumference = 119.4;
    const pct = Math.min(watched / limit, 1);
    circle.style.strokeDashoffset = circumference - (pct * circumference);
    if (label) label.innerText = `${Math.min(watched, limit)}/${limit}`;
}

document.addEventListener('DOMContentLoaded', () => setDockActive(-1));
