<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TallaStatus — Post ads, earn money</title>
<style>
@import url('https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=general-sans@400,500,600&display=swap');
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap');

:root{
  --ink:#0F1A12; --bone:#F3EFE3; --bone-dim:#E7E1D0;
  --forest:#1C6B45; --forest-dark:#154F33;
  --amber:#E7A23D; --ember:#D14B33;
  --ink-mist:#5C6B5E; --bone-mist:#B9C2B6;
  --radius:18px; --radius-sm:12px;
  --shadow:0 18px 40px -22px rgba(15,26,18,.45);
  --font-display:'Clash Display',sans-serif;
  --font-body:'General Sans',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bone);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
}
.shell{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

.topbar{
  position:sticky;top:0;z-index:10;
  background:var(--ink);color:var(--bone);
  padding:16px 20px;display:flex;flex-direction:column;gap:14px;
  box-shadow:var(--shadow);
}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.3rem;display:flex;align-items:center;gap:8px;letter-spacing:.2px;}
.brand-dot{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px rgba(231,162,61,.25);}
.roletabs{display:flex;gap:6px;background:rgba(255,255,255,.06);padding:4px;border-radius:999px;}
.tab{
  flex:1;border:none;background:transparent;color:var(--bone-mist);
  font-family:var(--font-display);font-weight:600;font-size:.82rem;
  padding:9px 10px;border-radius:999px;cursor:pointer;transition:all .2s ease;
}
.tab.active{background:var(--bone);color:var(--ink);}

main#app{flex:1;padding:18px 16px 28px;display:flex;flex-direction:column;gap:18px;}

h2{font-family:var(--font-display);font-weight:600;font-size:1.05rem;margin:0 0 10px;}
h3{font-family:var(--font-display);font-weight:600;font-size:.98rem;margin:0;}
p{margin:0 0 8px;line-height:1.5;}
.muted{color:var(--ink-mist);}
.small{font-size:.82rem;}

.card{
  background:#fff;border:1px solid rgba(15,26,18,.08);
  border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);
  animation:rise .5s ease both;
}
.profile-gate p{margin-top:0;}

.stacked-form{display:flex;flex-direction:column;gap:10px;}
.form-row{display:flex;gap:10px;}
.form-row input{flex:1;min-width:0;}
input,textarea{
  font-family:var(--font-body);font-size:.92rem;
  border:1.5px solid rgba(15,26,18,.14);border-radius:var(--radius-sm);
  padding:11px 13px;background:var(--bone);color:var(--ink);width:100%;
}
input:focus,textarea:focus{outline:2px solid var(--amber);outline-offset:1px;border-color:var(--amber);}
.note-input{width:100%;min-height:46px;resize:vertical;margin:8px 0;}

button{font-family:var(--font-display);cursor:pointer;border:none;transition:transform .15s ease,box-shadow .15s ease;}
button:active{transform:scale(.97);}
.btn-primary{
  background:var(--forest);color:var(--bone);
  font-weight:600;font-size:.88rem;padding:11px 18px;border-radius:999px;
}
.btn-primary:hover{background:var(--forest-dark);}
.btn-secondary{
  background:transparent;color:var(--ink);border:1.5px solid rgba(15,26,18,.2)!important;
  font-weight:600;font-size:.85rem;padding:9px 16px;border-radius:999px;text-decoration:none;display:inline-block;
}
.btn-primary.small,.btn-secondary.small{padding:8px 14px;font-size:.8rem;}

.hero-card{
  background:var(--ink);color:var(--bone);border-radius:var(--radius);
  padding:22px;display:flex;flex-direction:column;align-items:center;gap:14px;
  box-shadow:var(--shadow);animation:rise .5s ease both;
}
.hero-ring{position:relative;width:84px;height:84px;}
.hero-ring-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.ring-num{font-family:var(--font-mono);font-weight:700;font-size:.72rem;text-align:center;}
.hero-stats{display:flex;gap:28px;text-align:center;}
.hero-stats strong{display:block;font-family:var(--font-mono);font-size:1.2rem;}
.hero-stats span{font-size:.74rem;color:var(--bone-mist);}

.howto ol{list-style:none;counter-reset:step;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
.howto li{counter-increment:step;display:flex;gap:12px;align-items:baseline;font-size:.88rem;}
.howto li::before{
  content:counter(step);font-family:var(--font-mono);font-weight:700;
  background:var(--amber);color:var(--ink);width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.74rem;
}

.campaign-grid{display:flex;flex-direction:column;gap:12px;}
.campaign-card{
  display:flex;gap:12px;background:#fff;border:1px solid rgba(15,26,18,.08);
  border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);
  animation:rise .5s ease both;
}
.campaign-img{width:72px;height:72px;border-radius:var(--radius-sm);object-fit:cover;flex-shrink:0;}
.campaign-body{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0;}
.campaign-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.campaign-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.inline-form{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%;}
.inline-form input[type=file]{flex:1;min-width:120px;font-size:.78rem;padding:7px;}
.inline-form input[type=number]{width:110px;}

.lock-row{display:flex;align-items:center;gap:8px;font-size:.78rem;}

.status-badge{
  font-family:var(--font-mono);font-size:.74rem;font-weight:600;
  padding:6px 10px;border-radius:999px;display:inline-block;
}
.status-badge.pending{background:rgba(231,162,61,.16);color:#9a6a1c;}
.status-badge.approved{background:rgba(28,107,69,.14);color:var(--forest-dark);}
.status-badge.rejected{background:rgba(209,75,51,.14);color:var(--ember);}
.status-badge.full{background:rgba(15,26,18,.08);color:var(--ink-mist);}

.stats-row{display:flex;gap:10px;}
.stat-pill{
  flex:1;background:#fff;border:1px solid rgba(15,26,18,.08);border-radius:var(--radius-sm);
  padding:12px;text-align:center;box-shadow:var(--shadow);
}
.stat-pill strong{display:block;font-family:var(--font-mono);font-size:1.1rem;}
.stat-pill span{font-size:.7rem;color:var(--ink-mist);}

.review-card{
  display:flex;gap:12px;background:#fff;border:1px solid rgba(15,26,18,.08);
  border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow);
}
.review-img{width:90px;height:120px;object-fit:cover;border-radius:var(--radius-sm);flex-shrink:0;}
.review-body{flex:1;display:flex;flex-direction:column;min-width:0;}
.review-actions{display:flex;gap:8px;}

.empty{
  text-align:center;color:var(--ink-mist);font-size:.86rem;
  border:1.5px dashed rgba(15,26,18,.16);border-radius:var(--radius);padding:24px;
}

.foot-note{
  font-size:.72rem;color:var(--ink-mist);text-align:center;padding:16px 24px 28px;
  font-family:var(--font-body);
}

.ring-fill{transition:stroke-dashoffset .6s ease;}

.toast{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--bone);padding:11px 18px;border-radius:999px;
  font-size:.84rem;opacity:0;pointer-events:none;transition:all .3s ease;box-shadow:var(--shadow);
  max-width:90vw;text-align:center;z-index:50;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.campaign-grid .campaign-card:nth-child(2){animation-delay:.05s;}
.campaign-grid .campaign-card:nth-child(3){animation-delay:.1s;}
.campaign-grid .campaign-card:nth-child(4){animation-delay:.15s;}

@media (prefers-reduced-motion:reduce){
  .card,.hero-card,.campaign-card{animation:none;}
  .ring-fill{transition:none;}
  button,.tab{transition:none;}
}

:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}

@media (min-width:560px){
  .shell{margin:24px auto;border-radius:28px;overflow:hidden;box-shadow:0 30px 70px -30px rgba(15,26,18,.5);}
}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><span class="brand-dot"></span>TallaStatus</div>
    <nav class="roletabs">
      <button class="tab active" data-role="poster" type="button">Status Posters</button>
      <button class="tab" data-role="advertiser" type="button">Businesses</button>
    </nav>
  </header>
  <main id="app">Loading app…</main>
  <footer class="foot-note">
    This is a working prototype — data is stored for testing purposes only. No real payments are made yet; screenshot review is currently manual, not AI-based.
  </footer>
</div>
<div id="toast" class="toast"></div>

<script>
const STORAGE_KEYS = { profile: 'profile', campaigns: 'campaigns', entries: 'entries' };

let state = { role: 'poster', profile: null, campaigns: [], entries: [], ready: false };

/* ---------- storage helpers ---------- */
async function loadKey(key, shared) {
  try {
    const res = await window.storage.get(key, shared);
    return res ? JSON.parse(res.value) : null;
  } catch (e) {
    return null;
  }
}
async function saveKey(key, value, shared) {
  try {
    await window.storage.set(key, JSON.stringify(value), shared);
  } catch (e) {
    console.error('Storage save failed', key, e);
    showToast('Save failed, please try again.');
  }
}

/* ---------- utils ---------- */
function genId(prefix) {
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function timeAgo(ts) {
  if (!ts) return '';
  const mins = Math.floor((Date.now() - ts) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + ' min ago';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + ' hr ago';
  return Math.floor(hrs / 24) + ' day(s) ago';
}
function lockInfo(entry) {
  const hoursPassed = (Date.now() - entry.claimedAt) / 3600000;
  const remaining = Math.max(0, 24 - hoursPassed);
  const percent = Math.min(100, (hoursPassed / 24) * 100);
  return { remaining, percent, unlocked: hoursPassed >= 24 };
}
function ring(percent, size, strokeW, color) {
  const r = (size - strokeW) / 2;
  const c = 2 * Math.PI * r;
  const p = Math.max(0, Math.min(100, percent));
  const offset = c - (p / 100) * c;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="ring">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="rgba(15,26,18,.12)" stroke-width="${strokeW}" fill="none"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${strokeW}" fill="none"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}"
      transform="rotate(-90 ${size/2} ${size/2})" class="ring-fill"/>
  </svg>`;
}
function compressImage(file, maxW, quality) {
  maxW = maxW || 480; quality = quality || 0.65;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}
function emptyState(msg) {
  return `<div class="empty">${esc(msg)}</div>`;
}

/* ---------- data actions ---------- */
async function claimCampaign(id) {
  const c = state.campaigns.find(x => x.id === id);
  if (!c) return;
  const exists = state.entries.find(e => e.campaignId === id && e.posterPhone === state.profile.phone);
  if (exists) return;
  const entry = {
    id: genId('en'), campaignId: id, campaignTitle: c.title, payPerPost: c.payPerPost,
    posterName: state.profile.name, posterPhone: state.profile.phone,
    claimedAt: Date.now(), status: 'claimed', screenshotUrl: null, claimedViews: null,
    submittedAt: null, reviewedAt: null, reviewNote: null
  };
  state.entries.push(entry);
  await saveKey(STORAGE_KEYS.entries, state.entries, true);
  showToast('Ad claimed! Download the image and post it to your status.');
  render();
}
async function removeEntry(id) {
  state.entries = state.entries.filter(e => e.id !== id);
  await saveKey(STORAGE_KEYS.entries, state.entries, true);
  render();
}
async function submitScreenshot(entryId, file, views) {
  const entry = state.entries.find(e => e.id === entryId);
  if (!entry) return;
  if (!file || !file.size) { showToast('Select a screenshot first.'); return; }
  const dataUrl = await compressImage(file, 480, 0.6);
  entry.screenshotUrl = dataUrl;
  entry.claimedViews = views ? Number(views) : null;
  entry.status = 'submitted';
  entry.submittedAt = Date.now();
  await saveKey(STORAGE_KEYS.entries, state.entries, true);
  showToast('Screenshot submitted! Waiting for review from the advertiser.');
  render();
}
async function reviewEntry(entryId, decision, note) {
  const entry = state.entries.find(e => e.id === entryId);
  if (!entry) return;
  entry.status = decision;
  entry.reviewedAt = Date.now();
  entry.reviewNote = note || null;
  await saveKey(STORAGE_KEYS.entries, state.entries, true);
  showToast(decision === 'approved' ? 'Screenshot approved!' : 'Screenshot rejected.');
  render();
}

/* ---------- markup builders ---------- */
function profileGateHtml(role) {
  const label = role === 'poster' ? 'status posters' : 'businesses';
  return `
    <section class="card profile-gate">
      <h2>Welcome to TallaStatus</h2>
      <p class="muted">Enter your name to get started — this identifies you as one of our ${esc(label)}.</p>
      <form id="profile-form" class="stacked-form">
        <input name="name" placeholder="Full name" required />
        <input name="phone" placeholder="Phone number" required />
        <button type="submit" class="btn-primary">Get started</button>
      </form>
    </section>
  `;
}

function advertiserCampaignCard(c) {
  const approvedCount = state.entries.filter(
    e => e.campaignId === c.id && e.status === 'approved'
  ).length;

  const percent = Math.min(
    100,
    (approvedCount / c.targetPosts) * 100
  );

  return `
    <article class="campaign-card">
      <img src="${c.imageUrl}" alt="${esc(c.title)}" class="campaign-img" />

      <div class="campaign-body">

        <div class="campaign-top">
          <h3>${esc(c.title)}</h3>

          <span style="
            background:#D14B33;
            color:white;
            padding:4px 10px;
            border-radius:999px;
            font-size:.72rem;
            font-weight:600;
          ">
            LIVE
          </span>
        </div>

        <p class="muted small">
          Asset: campaign-image.jpg
        </p>

        <div style="margin-top:6px;">
          <p class="muted small" style="margin-bottom:6px;">
            Views Metric Tracking:
          </p>

          <div style="
            width:100%;
            height:8px;
            background:rgba(15,26,18,.12);
            border-radius:999px;
            overflow:hidden;
          ">
            <div style="
              width:${percent}%;
              height:100%;
              background:linear-gradient(
                90deg,
                var(--amber),
                var(--forest)
              );
              border-radius:999px;
            "></div>
          </div>

          <p class="small" style="
            margin-top:6px;
            font-weight:600;
          ">
            ${approvedCount} Approved Posts
          </p>
        </div>

      </div>
    </article>
  `;
    }

function campaignCard(c) {
  const myEntry = state.entries.find(e => e.campaignId === c.id && e.posterPhone === state.profile.phone);
  const approvedCount = state.entries.filter(e => e.campaignId === c.id && e.status === 'approved').length;
  const percent = Math.min(100, (approvedCount / c.targetPosts) * 100);
  const full = approvedCount >= c.targetPosts;
  let actionHtml = '';

  if (!myEntry) {
    actionHtml = full
      ? `<span class="status-badge full">Filled</span>`
      : `<button data-action="claim" data-id="${c.id}" class="btn-primary small" type="button">Claim this ad</button>`;
  } else if (myEntry.status === 'claimed') {
    const li = lockInfo(myEntry);
    actionHtml = `
      <a href="${c.imageUrl}" download="ad-${c.id}.jpg" class="btn-secondary small">⬇ Download image</a>
      ${li.unlocked ? `
        <form id="screenshot-form-${myEntry.id}" data-entry-id="${myEntry.id}" class="inline-form">
          <input type="file" name="screenshot" accept="image/*" required />
          <input type="number" name="views" placeholder="Views (optional)" min="0" />
          <button type="submit" class="btn-primary small">Submit proof</button>
        </form>` : `
        <div class="lock-row">
          ${ring(li.percent, 48, 5, 'var(--amber)')}
          <span class="muted">${li.remaining.toFixed(1)} hr left before you can upload proof</span>
        </div>`}
    `;
  } else if (myEntry.status === 'submitted') {
    actionHtml = `<span class="status-badge pending">⏳ Under review since ${timeAgo(myEntry.submittedAt)}</span>`;
  } else if (myEntry.status === 'approved') {
    actionHtml = `<span class="status-badge approved">✓ Approved • ₦${Number(myEntry.payPerPost).toLocaleString()}</span>`;
  } else if (myEntry.status === 'rejected') {
    actionHtml = `<span class="status-badge rejected">Rejected${myEntry.reviewNote ? ': ' + esc(myEntry.reviewNote) : ''}</span>
      <button data-action="reclaim" data-id="${myEntry.id}" class="btn-secondary small" type="button">Try again</button>`;
  }

  return `
    <article class="campaign-card">
      <img src="${c.imageUrl}" alt="${esc(c.title)}" class="campaign-img" />
      <div class="campaign-body">
        <div class="campaign-top">
          <h3>${esc(c.title)}</h3>
          ${ring(percent, 44, 5, 'var(--forest)')}
        </div>
        <p class="muted small">Views Metric Tracking: ${approvedCount} / ${c.targetPosts}</p>
        <div class="views-track" style="background:rgba(15,26,18,.1);border-radius:999px;height:6px;overflow:hidden;">
          <div style="width:${percent}%;height:100%;background:var(--forest);border-radius:999px;"></div>
        </div>
        <div class="campaign-actions">${actionHtml}</div>
      </div>
    </article>
  `;
  }

function reviewCard(e) {
  return `
    <article class="review-card">
      <img src="${e.screenshotUrl}" alt="hoton shaida" class="review-img" />
      <div class="review-body">
        <p><strong>${esc(e.posterName)}</strong> <span class="muted small">• ${esc(e.posterPhone)}</span></p>
        <p class="muted small">${esc(e.campaignTitle)} • ${e.claimedViews ? esc(String(e.claimedViews)) + ' views (self-reported) • ' : ''}submitted ${timeAgo(e.submittedAt)}</p>
        <textarea data-note-for="${e.id}" placeholder="Reason for rejection (if any)" class="note-input"></textarea>
        <div class="review-actions">
          <button data-action="approve" data-id="${e.id}" class="btn-primary small" type="button">Approve</button>
          <button data-action="reject" data-id="${e.id}" class="btn-secondary small" type="button">Reject</button>
        </div>
      </div>
    </article>
  `;
}

/* ---------- view renderers ---------- */
function renderPoster() {
  if (!state.profile) return profileGateHtml('poster');
  const myApproved = state.entries.filter(e => e.status === 'approved' && e.posterPhone === state.profile.phone);
  const totalEarned = myApproved.reduce((s, e) => s + Number(e.payPerPost || 0), 0);
  const pendingCount = state.entries.filter(e => e.status === 'submitted' && e.posterPhone === state.profile.phone).length;
  return `
    <section class="hero-card">
      <div class="hero-ring">
        ${ring(Math.min(100, (myApproved.length / 10) * 100), 84, 9, 'var(--forest)')}
        <div class="hero-ring-center"><span class="ring-num">₦${totalEarned.toLocaleString()}</span></div>
      </div>
      <div class="hero-stats">
        <div><strong>${myApproved.length}</strong><span class="muted">approved posts</span></div>
        <div><strong>${pendingCount}</strong><span class="muted">in review</span></div>
      </div>
      ${totalEarned > 0 ? `<button class="btn-secondary small" data-action="cashout" type="button">Request cashout</button>` : ''}
    </section>
    <section class="howto">
      <ol>
        <li><strong>Claim an ad</strong> from the list below</li>
        <li><strong>Download the image</strong>, post it to your Status</li>
        <li><strong>Wait 24 hours</strong> so people can see it</li>
        <li><strong>Upload a screenshot</strong> so it can be reviewed and you get paid</li>
      </ol>
    </section>
    <section>
      <h2>Available ads</h2>
      <div class="campaign-grid">
        ${state.campaigns.length ? state.campaigns.map(campaignCard).join('') : emptyState('No ads right now. Check back later.')}
      </div>
    </section>
  `;
}

function renderAdvertiser() {
  if (!state.profile) return profileGateHtml('advertiser');
  const mine = state.campaigns.filter(c => c.advertiser === state.profile.name);
  const myIds = mine.map(c => c.id);
  const pendingReview = state.entries.filter(e => e.status === 'submitted' && myIds.includes(e.campaignId));
  const totalSpend = state.entries.filter(e => e.status === 'approved' && myIds.includes(e.campaignId)).reduce((s, e) => s + Number(e.payPerPost || 0), 0);
  return `
    <section class="card">
      <h2>Create a new ad</h2>
      <form id="campaign-form" class="stacked-form">
        <input name="title" placeholder="Business / ad name" required />
        <div class="form-row">
          <input name="targetPosts" type="number" min="1" placeholder="Number of people needed" required />
          <input name="payPerPost" type="number" min="0" placeholder="₦ per post" required />
        </div>
        <input name="image" type="file" accept="image/*" required />
        <button type="submit" class="btn-primary">Launch ad</button>
      </form>
    </section>
    <section class="stats-row">
      <div class="stat-pill"><strong>${mine.length}</strong><span>ads</span></div>
      <div class="stat-pill"><strong>${pendingReview.length}</strong><span>pending review</span></div>
      <div class="stat-pill"><strong>₦${totalSpend.toLocaleString()}</strong><span>spent</span></div>
    </section>
    <section>
      <h2>My ads</h2>
      <div class="campaign-grid">
        ${mine.length ? mine.map(advertiserCampaignCard).join('') : emptyState('Create your first ad above.')}
      </div>
    </section>
    <section>
      <h2>Review queue (${pendingReview.length})</h2>
      ${pendingReview.length ? pendingReview.map(reviewCard).join('') : emptyState('No new screenshots to review yet.')}
    </section>
  `;
}

function render() {
  document.getElementById('app').innerHTML = state.role === 'poster' ? renderPoster() : renderAdvertiser();
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.role === state.role));
}

/* ---------- event delegation ---------- */
function onAppClick(e) {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;
  if (action === 'claim') claimCampaign(btn.dataset.id);
  else if (action === 'reclaim') removeEntry(btn.dataset.id);
  else if (action === 'approve') reviewEntry(btn.dataset.id, 'approved');
  else if (action === 'reject') {
    const noteEl = document.querySelector(`[data-note-for="${btn.dataset.id}"]`);
    reviewEntry(btn.dataset.id, 'rejected', noteEl ? noteEl.value.trim() : '');
  } else if (action === 'cashout') {
    showToast('Your request has been received — we will contact you within 24 hours (demo only, no real money).');
  }
}

async function onAppSubmit(e) {
  e.preventDefault();
  if (e.target.id === 'profile-form') {
    const fd = new FormData(e.target);
    state.profile = { name: fd.get('name').trim(), phone: fd.get('phone').trim() };
    await saveKey(STORAGE_KEYS.profile, state.profile, false);
    render();
  } else if (e.target.id === 'campaign-form') {
    const fd = new FormData(e.target);
    const file = fd.get('image');
    if (!file || !file.size) { showToast('Select an ad image.'); return; }
    const submitBtn = e.target.querySelector('button[type="submit"]');
    if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Uploading…'; }
    try {
      const imageUrl = await compressImage(file, 480, 0.65);
      const campaign = {
        id: genId('cm'), advertiser: state.profile.name,
        title: fd.get('title').trim(), imageUrl,
        targetPosts: Number(fd.get('targetPosts')), payPerPost: Number(fd.get('payPerPost')),
        createdAt: Date.now()
      };
      state.campaigns.push(campaign);
      await saveKey(STORAGE_KEYS.campaigns, state.campaigns, true);
      showToast('New ad launched!');
      render();
    } catch (err) {
      showToast('Image upload failed, please try another image.');
      if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'Launch ad'; }
    }
  } else if (e.target.id && e.target.id.indexOf('screenshot-form-') === 0) {
    const entryId = e.target.dataset.entryId;
    const fd = new FormData(e.target);
    await submitScreenshot(entryId, fd.get('screenshot'), fd.get('views'));
  }
}

/* ---------- init ---------- */
async function init() {
  const [profile, campaigns, entries] = await Promise.all([
    loadKey(STORAGE_KEYS.profile, false),
    loadKey(STORAGE_KEYS.campaigns, true),
    loadKey(STORAGE_KEYS.entries, true)
  ]);
  state.profile = profile;
  state.campaigns = campaigns || [];
  state.entries = entries || [];
  state.ready = true;
  render();
}

document.getElementById('app').addEventListener('click', onAppClick);
document.getElementById('app').addEventListener('submit', onAppSubmit);
document.querySelectorAll('.roletabs .tab').forEach(btn => {
  btn.addEventListener('click', () => { state.role = btn.dataset.role; render(); });
});
setInterval(() => { if (state.ready) render(); }, 60000);

init();
</script>
</body>
</html>
