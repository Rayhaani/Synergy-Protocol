<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Synergy — Support Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#020617; --surface:#050a15; --surface2:#0a0f1e; --surface3:#111827;
  --border:#222840; --border2:#2C3450;
  --lime:#C6F135; --lime-dim:rgba(198,241,53,.12);
  --teal:#00E5C0; --teal-dim:rgba(0,229,192,.10);
  --amber:#FFB800;
  --red:#FF4C6A; --red-dim:rgba(255,76,106,.10);
  --text:#EEEAE0; --text2:#8A91AD; --text3:#3E4460;
  --radius-sm:10px; --radius:16px;
  --font-b:'Quicksand',sans-serif;
  --ease:cubic-bezier(.22,.68,0,1.2);
}
body{
  margin:0; font-family:var(--font-b); color:var(--text); background:var(--bg);
  background-image:radial-gradient(circle at 50% 0%, rgba(112,0,255,.12), transparent 60%),
    url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
  min-height:100vh; -webkit-font-smoothing:antialiased;
}
button,input,textarea{font-family:inherit;font-size:inherit;border:none;outline:none;background:none}
button{cursor:pointer}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}

#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

#header{
  position:sticky;top:0;left:50%;width:100vw;margin-left:-50vw;z-index:200;
  background:rgba(2,6,23,.97);backdrop-filter:blur(20px) saturate(160%);
  border-bottom:1px solid rgba(255,255,255,.06);
}
.header-inner{max-width:520px;margin:0 auto;padding:16px 20px}
.header-top{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:4px}
.brand-dot{width:10px;height:10px;border-radius:50%;background:var(--lime);flex-shrink:0}
.app-title{font-family:var(--font-b);font-size:18px;font-weight:700;color:#fff;text-align:center}
.app-sub{font-size:10px;color:var(--text3);text-align:center;letter-spacing:.5px;text-transform:uppercase}

#content{flex:1;padding:18px 20px 40px}

.search-wrap{position:relative;margin-bottom:12px}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.4;pointer-events:none}
#searchInput{
  width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:11px 16px 11px 40px;color:var(--text);font-size:13px;
}
#searchInput::placeholder{color:var(--text3)}

.pill-row{display:flex;gap:7px;overflow-x:auto;margin-bottom:16px;scrollbar-width:none}
.pill-row::-webkit-scrollbar{display:none}
.pill{
  padding:7px 14px;border:1px solid var(--border);border-radius:99px;font-size:11px;font-weight:600;
  color:var(--text2);background:var(--surface);white-space:nowrap;flex-shrink:0;transition:all .18s;
}
.pill.active{background:var(--lime);border-color:var(--lime);color:var(--bg)}

#threadList{display:flex;flex-direction:column;gap:10px}

.thread-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;transition:border-color .18s;
}
.thread-card:active{border-color:var(--border2)}
.thread-avatar{
  width:38px;height:38px;border-radius:50%;background:var(--teal-dim);border:1px solid rgba(0,229,192,.3);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--teal);
  flex-shrink:0;
}
.thread-body{flex:1;min-width:0}
.thread-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:3px}
.thread-name{font-size:13px;font-weight:700;color:var(--text)}
.thread-time{font-size:9px;color:var(--text3);flex-shrink:0}
.thread-preview{font-size:11px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thread-meta{display:flex;gap:6px;margin-top:6px;align-items:center}
.status-badge{
  padding:2px 8px;border-radius:99px;font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
}
.status-open{background:var(--teal-dim);color:var(--teal);border:1px solid rgba(0,229,192,.25)}
.status-resolved{background:var(--surface2);color:var(--text3);border:1px solid var(--border)}
.status-banned{background:var(--red-dim);color:var(--red);border:1px solid rgba(255,76,106,.25)}
.unread-dot{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 6px var(--lime)}

#emptyState{display:none;flex-direction:column;align-items:center;padding:60px 20px;text-align:center;gap:8px}
#emptyState .e-icon{font-size:42px;opacity:.3}
#emptyState h3{font-family:var(--font-b);font-size:15px;color:var(--text2)}
#emptyState p{font-size:12px;color:var(--text3)}

#chatOverlay{
  display:none;position:fixed;inset:0;background:rgba(4,5,10,.85);backdrop-filter:blur(14px);
  z-index:61000;align-items:flex-end;justify-content:center;
}
#chatOverlay.open{display:flex}
#chatSheet{
  background:var(--surface);border:1px solid var(--border2);border-radius:24px 24px 0 0;
  width:100%;max-width:520px;height:88vh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .32s cubic-bezier(.22,.68,0,1);
}
#chatSheet.open{transform:translateY(0)}
.sheet-handle{display:flex;justify-content:center;padding:6px 0 0}
.sheet-handle-bar{width:36px;height:4px;background:var(--border2);border-radius:99px}
.chat-header{
  padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-bottom:1px solid var(--border);
}
.chat-header-left{display:flex;align-items:center;gap:10px;min-width:0}
.chat-header-title{font-family:var(--font-b);font-weight:700;font-size:14px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-header-actions{display:flex;gap:6px;flex-shrink:0}
.action-btn{
  padding:6px 11px;border-radius:8px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;
  border:1px solid var(--border);color:var(--text2);background:var(--surface2);
}
.action-btn.resolve{color:var(--teal);border-color:rgba(0,229,192,.25)}
.action-btn.ban{color:var(--red);border-color:rgba(255,76,106,.25)}

#chatMessages{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:78%;padding:10px 13px;font-size:12.5px;line-height:1.5;border-radius:14px}
.msg-member{align-self:flex-start;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-bottom-left-radius:3px}
.msg-admin{align-self:flex-end;background:var(--lime-dim);border:1px solid rgba(198,241,53,.3);color:var(--text);border-bottom-right-radius:3px}
.msg-time{display:block;font-size:8.5px;color:var(--text3);margin-top:4px}

.chat-input-row{
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border);
  display:flex;gap:8px;background:var(--bg);
}
#chatInput{
  flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:11px 15px;color:var(--text);font-size:13px;
}
#chatInput::placeholder{color:var(--text3)}
#sendBtn{
  background:var(--lime);color:var(--bg);padding:11px 18px;border-radius:var(--radius-sm);
  font-weight:700;font-size:12px;flex-shrink:0;transition:transform .15s var(--ease);
}
#sendBtn:active{transform:scale(.96)}
#sendBtn:disabled{background:var(--surface2);color:var(--text3)}
</style>
</head>
<body>
<div id="app">

  <header id="header">
    <div class="header-inner">
      <div class="header-top">
        <span class="brand-dot"></span>
        <div class="app-title">Support Control</div>
      </div>
      <div class="app-sub" id="threadCountLabel">Live member threads</div>
    </div>
  </header>

  <main id="content">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="search" id="searchInput" placeholder="Filter by name…" oninput="renderThreads()"/>
    </div>

    <div class="pill-row" id="filterRow">
      <button class="pill active" data-filter="all" onclick="setFilter('all',this)">All</button>
      <button class="pill" data-filter="unread" onclick="setFilter('unread',this)">Unread</button>
      <button class="pill" data-filter="open" onclick="setFilter('open',this)">Active</button>
      <button class="pill" data-filter="resolved" onclick="setFilter('resolved',this)">Resolved</button>
      <button class="pill" data-filter="banned" onclick="setFilter('banned',this)">Banned</button>
    </div>

    <div id="threadList"></div>

    <div id="emptyState">
      <div class="e-icon">💬</div>
      <h3>No threads yet</h3>
      <p>Member messages will appear here in real time.</p>
    </div>
  </main>

</div>

<div id="chatOverlay" onclick="closeChatOnOverlay(event)">
  <div id="chatSheet">
    <div class="sheet-handle"><div class="sheet-handle-bar"></div></div>
    <div class="chat-header">
      <div class="chat-header-left">
        <div class="chat-header-title" id="chatMemberName">—</div>
      </div>
      <div class="chat-header-actions">
        <button class="action-btn resolve" onclick="setThreadStatus('resolved')">Resolve</button>
        <button class="action-btn ban" onclick="setThreadStatus('banned')">Ban</button>
      </div>
    </div>
    <div id="chatMessages"></div>
    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="Type your response…" onkeydown="if(event.key==='Enter')sendAdminMessage()"/>
      <button id="sendBtn" onclick="sendAdminMessage()">Send</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDLTwLq8Le9vYAwRkRcqXPGxFnEqW1yE2E",
  authDomain: "synergy-protocol.firebaseapp.com",
  databaseURL: "https://synergy-protocol-default-rtdb.firebaseio.com",
  projectId: "synergy-protocol",
  storageBucket: "synergy-protocol.firebasestorage.app",
  messagingSenderId: "179647543031",
  appId: "1:179647543031:web:388da8a36e1bbbb55d85f2"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const THREADS_COL = "mc_support_threads";

let threads = [];
let activeFilter = "all";
let activeThreadId = null;
let unsubMessages = null;

function timeAgo(ts){
  if(!ts) return "";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const diff = Math.floor((Date.now()-d.getTime())/1000);
  if(diff<60) return "now";
  if(diff<3600) return Math.floor(diff/60)+"m";
  if(diff<86400) return Math.floor(diff/3600)+"h";
  return Math.floor(diff/86400)+"d";
}
function initials(name){
  return (name||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]?.toUpperCase()).join("");
}

db.collection(THREADS_COL).orderBy("lastMessageAt","desc").onSnapshot(snap=>{
  threads = snap.docs.map(d=>({ id:d.id, ...d.data() }));
  renderThreads();
});

function setFilter(filter, btn){
  activeFilter = filter;
  document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  renderThreads();
}

function renderThreads(){
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  let list = threads.filter(t=>{
    if(activeFilter==='unread' && !t.unreadByAdmin) return false;
    if(activeFilter==='open' && t.status!=='open') return false;
    if(activeFilter==='resolved' && t.status!=='resolved') return false;
    if(activeFilter==='banned' && t.status!=='banned') return false;
    if(search && !(t.memberName||"").toLowerCase().includes(search)) return false;
    return true;
  });

  const container = document.getElementById('threadList');
  const empty = document.getElementById('emptyState');
  document.getElementById('threadCountLabel').textContent =
    `${threads.length} thread${threads.length===1?'':'s'} · ${threads.filter(t=>t.unreadByAdmin).length} unread`;

  if(list.length===0){
    container.innerHTML='';
    empty.style.display='flex';
    return;
  }
  empty.style.display='none';

  container.innerHTML = list.map(t=>`
    <div class="thread-card" onclick="openThread('${t.id}')">
      <div class="thread-avatar">${initials(t.memberName)}</div>
      <div class="thread-body">
        <div class="thread-top">
          <span class="thread-name">${t.memberName||'Unknown member'}</span>
          <span class="thread-time">${timeAgo(t.lastMessageAt)}</span>
        </div>
        <div class="thread-preview">${t.lastMessage||''}</div>
        <div class="thread-meta">
          <span class="status-badge status-${t.status||'open'}">${t.status||'open'}</span>
          ${t.unreadByAdmin ? '<span class="unread-dot"></span>' : ''}
        </div>
      </div>
    </div>
  `).join('');
}

function openThread(threadId){
  activeThreadId = threadId;
  const thread = threads.find(t=>t.id===threadId);
  document.getElementById('chatMemberName').textContent = thread?.memberName || 'Member';

  db.collection(THREADS_COL).doc(threadId).update({ unreadByAdmin:false }).catch(()=>{});

  if(unsubMessages) unsubMessages();
  unsubMessages = db.collection(THREADS_COL).doc(threadId).collection("messages")
    .orderBy("createdAt","asc")
    .onSnapshot(snap=>{
      const messages = snap.docs.map(d=>d.data());
      const box = document.getElementById('chatMessages');
      box.innerHTML = messages.map(m=>`
        <div class="msg ${m.senderRole==='admin'?'msg-admin':'msg-member'}">
          ${m.text}
          <span class="msg-time">${m.createdAt ? timeAgo(m.createdAt) : 'sending…'}</span>
        </div>
      `).join('');
      box.scrollTop = box.scrollHeight;
    });

  document.getElementById('chatOverlay').classList.add('open');
  setTimeout(()=>document.getElementById('chatSheet').classList.add('open'), 10);
}

function closeChatOnOverlay(e){
  if(e.target===document.getElementById('chatOverlay')) closeChat();
}
function closeChat(){
  document.getElementById('chatSheet').classList.remove('open');
  setTimeout(()=>document.getElementById('chatOverlay').classList.remove('open'), 320);
  if(unsubMessages){ unsubMessages(); unsubMessages=null; }
  activeThreadId = null;
}

async function sendAdminMessage(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text || !activeThreadId) return;
  input.value='';

  await db.collection(THREADS_COL).doc(activeThreadId).collection("messages").add({
    senderRole:'admin', text, createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  await db.collection(THREADS_COL).doc(activeThreadId).update({
    lastMessage:text, lastMessageAt: firebase.firestore.FieldValue.serverTimestamp(), unreadByMember:true, status:'open'
  });
}

async function setThreadStatus(status){
  if(!activeThreadId) return;
  await db.collection(THREADS_COL).doc(activeThreadId).update({ status });
}
</script>
</body>
</html>
