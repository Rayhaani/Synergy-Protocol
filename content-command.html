<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNERGY | CONTENT COMMAND</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        :root { --aqua: #00f2fe; --neon-red: #ff0055; --bg: #030712; }
        body { 
            background: var(--bg); color: #fff; font-family: 'Quicksand', sans-serif;
            background-image: linear-gradient(to bottom, rgba(0, 242, 254, 0.03) 1px, transparent 1px), linear-gradient(to right, rgba(0, 242, 254, 0.03) 1px, transparent 1px);
            background-size: 30px 30px; min-height: 100vh;
        }
        .orbitron { font-family: 'Syncopate', sans-serif; text-transform: uppercase; letter-spacing: 2px; }
        .glass-panel { background: rgba(255, 255, 255, 0.01); backdrop-filter: blur(30px); border: 1px solid rgba(0, 242, 254, 0.1); }
        .glow-text { text-shadow: 0 0 10px var(--aqua); }
        .input-box { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(0, 242, 254, 0.1); padding: 15px; border-radius: 12px; outline: none; width: 100%; font-size: 13px; transition: all 0.3s; color: white; }
        .input-box:focus { border-color: var(--aqua); box-shadow: 0 0 15px rgba(0, 242, 254, 0.1); }
        .btn-prime { background: var(--aqua); color: #000; padding: 12px 30px; border-radius: 10px; font-weight: 700; font-size: 11px; text-transform: uppercase; transition: all 0.3s; cursor: pointer; }
        .btn-prime:hover { box-shadow: 0 0 20px rgba(0, 242, 254, 0.4); transform: translateY(-2px); }
        .badge-node { background: rgba(0, 242, 254, 0.1); color: var(--aqua); border: 1px solid rgba(0, 242, 254, 0.2); padding: 4px 10px; border-radius: 6px; font-size: 9px; font-weight: 700; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <div class="mb-12 text-center">
            <h1 class="orbitron text-2xl font-bold glow-text">Content Command</h1>
            <p class="text-[10px] text-cyan-400 tracking-[6px] uppercase">YouTube Node & Earning Management</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1 space-y-6">
                <div class="glass-panel p-6 rounded-2xl">
                    <p class="orbitron text-[10px] text-cyan-400 mb-6 font-bold">Inject New Video</p>
                    <div class="space-y-4">
                        <div>
                            <label class="text-[9px] uppercase font-bold text-gray-500 mb-2 block">Select Target Channel</label>
                            <select id="channel-node" class="input-box bg-gray-900">
                                <option value="@AIWealthAcademy_Global">AI Wealth Academy</option>
                                <option value="@UrbanVision2050">Urban Vision 2050</option>
                                <option value="@ZenithNature4K">Zenith Nature 4K</option>
                                <option value="@CosmicHorizon_X">Cosmic Horizon</option>
                                <option value="@GlobalWealthSecretHQ">Global Wealth Secret</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[9px] uppercase font-bold text-gray-500 mb-2 block">Video Title (Exact Search Query)</label>
                            <input type="text" id="task-title" placeholder="e.g. Urban Vision 2050 Ep 1" class="input-box">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="text-[9px] uppercase font-bold text-gray-500 mb-2 block">Duration (Secs)</label>
                                <input type="number" id="task-duration" placeholder="e.g. 300" class="input-box">
                            </div>
                            <div>
                                <label class="text-[9px] uppercase font-bold text-gray-500 mb-2 block">Reward (₦)</label>
                                <input type="number" id="task-amount" placeholder="50.00" class="input-box">
                            </div>
                        </div>
                        
                        <button onclick="deployContent()" class="btn-prime w-full mt-4">Deploy to Firebase</button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-2">
                <div class="glass-panel p-6 rounded-2xl h-full">
                    <p class="orbitron text-[10px] text-cyan-400 font-bold mb-8">Live Firebase Nodes</p>
                    <div id="live-nodes-container" class="space-y-4">
                        </div>
                </div>
            </div>
        </div>
    </div>

<script>
    // 1. FIREBASE CONFIGURATION (Cikakken bayaninka na asali)
    const firebaseConfig = {
      apiKey: "AIzaSyDLTwLq8Le9vYAwRkRcqXPGxFnEqW1yE2E",
      authDomain: "synergy-protocol.firebaseapp.com",
      databaseURL: "https://synergy-protocol-default-rtdb.firebaseio.com", 
      projectId: "synergy-protocol",
      storageBucket: "synergy-protocol.firebasestorage.app",
      messagingSenderId: "179647543031",
      appId: "1:179647543031:web:388da8a36e1bbbb55d85f2"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    
    // 2. DEPLOY CONTENT (Tura bidiyo zuwa Firebase)
    function deployContent() {
        const channel = document.getElementById('channel-node').value;
        const title = document.getElementById('task-title').value;
        const duration = document.getElementById('task-duration').value;
        const amount = document.getElementById('task-amount').value;
        
        if(!title || !duration) {
        alert("please enter the full details");
            return;
        }

        const newTaskRef = database.ref('nodes/').push();
        newTaskRef.set({
            channel: channel,
            title: title,
            duration: parseInt(duration),
            amount: parseFloat(amount),
            timestamp: Date.now()
        }).then(() => {
            alert("Successfully Deployed to Firebase!");
            // Share filayen rubutu bayan an gama
            document.getElementById('task-title').value = '';
        }).catch((error) => {
            alert("error occured: " + error.message);
        });
    }

    // 3. REAL-TIME LISTENER (Dauko bidiyoyin da ke Firebase a nuna maka su)
    database.ref('nodes/').on('value', (snapshot) => {
        const container = document.getElementById('live-nodes-container');
        container.innerHTML = '';
        const data = snapshot.val();
        
        if (data) {
            Object.keys(data).reverse().forEach(key => {
                const task = data[key];
                const nodeHtml = `
                    <div class="p-4 rounded-xl flex items-center gap-4 bg-white/5 border-l-2 border-cyan-500 mb-3">
                        <div class="flex-1">
                            <div class="flex items-center gap-3 mb-1">
                                <span class="badge-node">${task.channel.replace(/-/g, ' ').toUpperCase()}</span>
                                <span class="text-[10px] text-gray-400 font-bold">WAIT: ${task.duration}s</span>
                            </div>
                            <p class="text-xs font-bold text-white uppercase">${task.title}</p>
                            <p class="text-[10px] text-cyan-400/60">₦${task.amount} | Code: ${task.code}</p>
                        </div>
                        <button onclick="deleteNode('${key}')" class="text-red-500 hover:text-red-400 text-xs font-bold">DELETE</button>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', nodeHtml);
            });
        } else {
            container.innerHTML = '<p class="text-gray-500 text-xs">No active nodes in database.</p>';
        }
    });

    // 4. DELETE FUNCTION (Don goge bidiyo)
    function deleteNode(key) {
        if(confirm("Are you sure you want to delete this node?")) {
            database.ref('nodes/' + key).remove();
        }
    }
    
    
    </script>
</body>
</html>
