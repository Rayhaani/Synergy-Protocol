<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZYNTA | OFFICIAL REGISTRATION</title>

    <meta property="og:title" content="ZYNTA | OFFICIAL NODE">
    <meta property="og:description" content="Secure your spot on the Zynta Protocol. Register now.">
    <meta property="og:image" content="https://zynta.org/assets/logo.png">

    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
        
    <style>
        :root { --aqua: #00f2fe; --purple: #7000ff; --bg: #020617; }
        body { background: var(--bg); color: #fff; font-family: 'Space Grotesk', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .orbitron { font-family: 'Syncopate', sans-serif; text-transform: uppercase; letter-spacing: 3px; font-size: 10px; }
        .glass-card { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(40px); border: 1px solid rgba(255, 255, 255, 0.08); border-top: 1px solid rgba(0, 242, 254, 0.3); transition: all 0.5s ease; overflow-y: auto; }
        .input-node { width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 8px 12px; border-radius: 12px; outline: none; color: white; transition: 0.3s; }
        .input-node:focus { border-color: var(--aqua); box-shadow: 0 0 15px rgba(0, 242, 254, 0.1); }
        .resend-btn-neon { background: transparent !important; border: 1px solid var(--aqua) !important; color: var(--aqua) !important; box-shadow: 0 0 15px rgba(0, 242, 254, 0.3); font-family: 'Syncopate', sans-serif !important; font-size: 11px !important; padding: 16px 40px !important; border-radius: 20px !important; transition: 0.4s !important; letter-spacing: 2px; }
        .resend-btn-neon:hover { background: var(--aqua) !important; color: #000 !important; box-shadow: 0 0 30px var(--aqua); }
        body { margin: 0; padding: 0; min-height: 100vh; background-color: #020617; background-image: radial-gradient(circle at 50% 50%, rgba(112, 0, 255, 0.15), transparent), url('https://www.transparenttextures.com/patterns/carbon-fibre.png'); background-attachment: fixed; color: #ffffff; font-family: 'Space Grotesk', sans-serif; overflow-x: hidden; }
    </style>
</head>
<body>
    
<div id="main-register-card" class="glass-card p-5 rounded-[30px] w-full max-w-md mx-4 relative z-10 max-h-[85vh] flex flex-col justify-between">
    <div class="mb-6">
        <div class="w-10 h-10 bg-cyan-500 rounded-full mx-auto mb-4 shadow-[0_0_15px_#00f2fe]"></div>
        <h1 style="font-family: 'Syncopate', sans-serif !important; letter-spacing: -1px; text-align: center; text-transform: lowercase;" class="text-[22px] font-bold text-white mb-1 w-full text-center">Zynta<span class="text-cyan-400">.</span></h1> 
        <p id="progress-text" style="font-family: 'Plus Jakarta Sans', sans-serif !important; letter-spacing: -0.01em; text-align: center; text-transform: capitalize;" class="text-[15px] text-cyan-400 font-bold w-full text-center mb-8">Create Your Account</p>
    
        <div id="form-content" class="space-y-3">
            <div><label class="orbitron text-gray-500 ml-1 mb-1 block">Full Name</label><input type="text" id="full-name" oninput="validateForm()" class="input-node"></div>
            <div id="step-email" class="hidden"><label class="orbitron text-gray-500 ml-1 mb-1 block">Email Address</label><input type="email" id="email" oninput="validateForm()" class="input-node"></div>
            <div id="step-user" class="hidden"><label class="orbitron text-gray-500 ml-1 mb-1 block">Username</label><input type="text" id="username" oninput="validateForm()" class="input-node"></div>
            <div id="step-state" class="hidden"><label class="orbitron text-gray-500 ml-1 mb-1 block">State</label><input type="text" id="state" oninput="validateForm()" class="input-node"></div>
            <div id="step-phone" class="hidden">
                <label class="orbitron text-gray-500 ml-1 mb-1 block">WhatsApp Number</label>
                <input type="tel" id="phone" oninput="validateForm()" placeholder="08012345678" class="input-node">
            </div>
            <div id="step-pass" class="hidden"><label class="orbitron text-gray-500 ml-1 mb-1 block">Password</label><input type="password" id="password" oninput="validateForm()" class="input-node"></div>
            
            <button id="reg-btn" onclick="register()" disabled class="w-full bg-white text-black py-4 rounded-2xl font-bold orbitron mt-2 opacity-20 cursor-not-allowed transition-all duration-500">ACTIVATE PROTOCOL</button>
        </div>
    </div>

    <p style="font-family: 'Plus Jakarta Sans', sans-serif !important; letter-spacing: -0.01em;" class="text-[13px] text-gray-500 text-center mt-6">
        Already have an account? <a href="signin.html" class="text-cyan-400 font-bold hover:underline">Sign In</a>
    </p>
</div>
    
<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyDLTwLq8Le9vYAwRkRcqXPGxFnEqW1yE2E", 
        authDomain: "synergy-protocol.firebaseapp.com", 
        projectId: "synergy-protocol",
        databaseURL: "https://synergy-protocol-default-rtdb.firebaseio.com" 
    };

    const app = firebase.initializeApp(firebaseConfig);
    firebase.firestore(app).settings({ cacheSizeBytes: firebase.firestore.CACHE_SIZE_UNLIMITED });
    
    const db = firebase.firestore();      
    const database = firebase.database(); 
    const auth = firebase.auth();           
    let checkInterval = null; 

    function getReferrerFromURL() {
        const params = new URLSearchParams(window.location.search);
        return params.get('ref') || "admin";
    }
    
    function validateForm() {
        const fullName = document.getElementById('full-name').value.trim();
        const email = document.getElementById('email').value.trim();
        const user = document.getElementById('username').value.trim();
        const state = document.getElementById('state').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const pass = document.getElementById('password').value.trim();

        const steps = [ 
            { el: 'step-email', valid: fullName.split(' ').length >= 2 }, 
            { el: 'step-user', valid: email.includes('@') && email.includes('.') }, 
            { el: 'step-state', valid: user.length >= 3 }, 
            { el: 'step-phone', valid: state.length >= 3 }, 
            { el: 'step-pass', valid: phone.length >= 10 },
            { el: 'reg-btn', valid: pass.length >= 6 }
        ];
        
        let completed = 0;
        steps.forEach(s => {
            const target = document.getElementById(s.el);
            if (s.valid) {
                if (target.id === 'reg-btn') { target.disabled = false; target.style.opacity = "1"; }
                else { target.classList.remove('hidden'); }
                completed++;
            }
        });
        document.getElementById('progress-text').innerText = `Initialize Sequence: ${Math.round((completed/6)*100)}%`;
    }

    async function register() {
        const btn = document.getElementById('reg-btn');
        const mainCard = document.getElementById('main-register-card'); 
        const email = document.getElementById('email').value.trim();
        const user = document.getElementById('username').value.toLowerCase().trim();
        const pass = document.getElementById('password').value.trim();
        const rawPhone = document.getElementById('phone').value.trim();
        const fullName = document.getElementById('full-name').value.trim();
        const state = document.getElementById('state').value.trim();
        const referrer = getReferrerFromURL();

        btn.disabled = true;
        btn.innerHTML = `<span class="orbitron animate-pulse">CONNECTING...</span>`;

        let formattedPhone = rawPhone.startsWith('0') ? '234' + rawPhone.substring(1) : (!rawPhone.startsWith('234') ? '234' + rawPhone : rawPhone);

        try {
            const userRef = db.collection("users").doc(user);
            const userDoc = await userRef.get();
            if (userDoc.exists) throw new Error("Unavailable");

            const phoneCheck = await db.collection("users").where("whatsapp", "==", formattedPhone).get();
            if (!phoneCheck.empty) throw new Error("Used");

            const userCredential = await auth.createUserWithEmailAndPassword(email, pass);
            await userCredential.user.sendEmailVerification();
            
            mainCard.style.display = 'none';
            showSuccessOverlay(email); 

            await userRef.set({
                uid: userCredential.user.uid,
                fullName: fullName,
                email: email, 
                username: user,
                state: state,
                whatsapp: formattedPhone, 
                isVerified: false,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                referredBy: referrer
            });

            await database.ref('users/' + user).set({
                whatsapp: formattedPhone,
                balance: 0,
                referredBy: referrer,
                last_update: new Date().toISOString()
            });

        } catch (e) {
            console.error("Auth Error:", e);
            btn.disabled = false;
            btn.innerHTML = "RETRY ACTIVATION";
        }
    }

    function showSuccessOverlay(email) {
        startVerificationListener(); 
        Swal.fire({
            html: `
                <div class="flex flex-col items-center">
                    <div class="w-12 h-12 bg-cyan-500 rounded-full mb-6 shadow-[0_0_20px_#00f2fe]"></div>
                    <h2 class="orbitron text-white text-xl mb-6">REGISTRATION SUCCESSFUL</h2>
                    <div style="background: rgba(255,255,255,0.03); padding: 25px; border-radius: 20px; border: 1px dashed rgba(0,242,254,0.3); width: 100%; color: #fff;">
                        <p style="font-family: 'Space Grotesk', sans-serif; font-size: 15px;">Email sent to <b style="color:#00f2fe;">${email}</b>. Verify to proceed.</p>
                        <p class="animate-pulse" style="font-size: 11px; color: #3fb950; margin-top: 10px; font-family: 'Syncopate', sans-serif;">Waiting for verification...</p>
                    </div>
                </div>`,
            background: '#020617', 
            showConfirmButton: true, 
            confirmButtonText: 'RESEND LINK', 
            allowOutsideClick: false,
            customClass: { popup: 'rounded-[35px] border border-cyan-500/30 shadow-2xl', confirmButton: 'resend-btn-neon orbitron' }
        }).then((result) => { if (result.isConfirmed) { resendVerification(); showSuccessOverlay(email); } });
    }

    function startVerificationListener() {
        if (checkInterval) clearInterval(checkInterval);
        checkInterval = setInterval(async () => {
            const currentUser = firebase.auth().currentUser;
            if (currentUser) {
                await currentUser.reload(); 
                if (currentUser.emailVerified) {
                    clearInterval(checkInterval); 
                    window.location.href = "signin.html";
                }
            }
        }, 3000);
    }
</script>
</body>
</html>
