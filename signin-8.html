<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZYNTA | LOGIN NODE</title>

    <meta property="og:title" content="ZYNTA | OFFICIAL NODE">
    <meta property="og:description" content="Access the Zynta Protocol. Sign in now.">
    <meta property="og:image" content="https://zynta.org/assets/logo.png">

    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
:root { --accent-1: #a78bfa; --accent-2: #f472b6; --bg: #0d0f14; }
body { background: var(--bg); color: #fff; font-family: 'Quicksand', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .orbitron { font-family: 'Quicksand', sans-serif; font-weight:700; text-transform: uppercase; letter-spacing: 2px; font-size: 10px; }

.glass-card {
    background: rgba(255, 255, 255, 0.02);
    backdrop-filter: blur(40px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-top: 1px solid rgba(167, 139, 250, 0.3);
    transition: all 0.5s ease;
}
         .input-node {
    width: 100%;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 6px 12px;
    border-radius: 12px;
    outline: none;
    color: white;
    transition: 0.3s;
         }
 .input-node:focus { border-color: var(--accent-1); box-shadow: 0 0 15px rgba(167, 139, 250, 0.15); }

.resend-btn-neon {
    background: transparent !important;
    border: 1px solid var(--accent-1) !important;
    color: var(--accent-1) !important;
    box-shadow: 0 0 15px rgba(167, 139, 250, 0.3);
    font-family: 'Quicksand', sans-serif !important;
    font-weight: 700 !important;
    font-size: 11px !important;
    padding: 16px 40px !important;
    border-radius: 20px !important;
    transition: 0.4s !important;
    letter-spacing: 2px;
}
.resend-btn-neon:hover { background: linear-gradient(135deg, var(--accent-1), var(--accent-2)) !important; color: #0d0f14 !important; box-shadow: 0 0 30px var(--accent-1); }

        /* GITHUB STYLE NOTIFICATION BAR */
#notification-bar {
    position: fixed;
    top: -100px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 450px;
    padding: 12px 20px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    font-family: 'Quicksand', sans-serif;
    z-index: 9999;
    transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    border: 1px solid rgba(167, 139, 250, 0.3);
}
.notif-success { background: #0c2d21; color: #3fb950; border-color: #238636 !important; }
.notif-error { background: #2d1616; color: #f85149; border-color: #da3633 !important; }

#notification-bar.show { top: 20px; }

.close-notif { cursor: pointer; font-weight: bold; font-size: 18px; margin-left: 15px; }

  /* SYNERGY PROTOCOL - GLOBAL BACKGROUND ENGINE */
body {
    margin: 0;
    padding: 0;
    height: 100vh;
    background-color: #0d0f14;
    background-image:
        radial-gradient(circle at 50% 50%, rgba(112, 0, 255, 0.15), transparent),
        url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
    background-attachment: fixed;
    color: #ffffff;
    font-family: 'Quicksand', sans-serif;
    overflow: hidden;
}

.glass-premium {
    background: rgba(255, 255, 255, 0.02);
    backdrop-filter: blur(40px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-top: 1px solid rgba(167, 139, 250, 0.3);
    border-radius: 24px;
}

/* EXACT PHOTO HEADER - ACCENT COLORS MAINTAINED */
.exact-photo-header {
    position: relative;
    width: calc(100% + 3rem);
   margin: -1.5rem -1.5rem 0 -1.5rem;
    height: 110px;
    border-top-left-radius: 32px;
    border-top-right-radius: 32px;
    overflow: hidden;
    background: transparent;
}

.exact-photo-header svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}

.close-btn-circle {
    position: absolute;
    top: 15px;
    right: 15px;
    width: 30px;
    height: 30px;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #0d0f14;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 0 12px rgba(167, 139, 250, 0.4);
    z-index: 10;
}

        /* Step Animation - kept from original login logic */
        .step-hidden { opacity: 0; transform: translateY(20px); pointer-events: none; display: none; }
        .step-visible {
            display: block;
            animation: reveal 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes reveal {
            from { opacity: 0; transform: translateY(20px); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        .btn-locked { opacity: 0.2; cursor: not-allowed; filter: grayscale(1); }
</style>
</head>
<body>
<div id="notification-bar">
    <span id="notif-message"></span>
    <span class="close-notif" onclick="closeNotif()">×</span>
</div>

 <div id="main-login-card" class="glass-card p-4 rounded-[32px] w-full max-w-md mx-4 relative z-10 overflow-hidden">
    <!-- SABUWAR HEADER IRIN TA PHOTO TARE DA COLOURS DIN ZYNTA -->
    <div class="exact-photo-header">
        <svg viewBox="0 0 500 150" preserveAspectRatio="none">
            <path d="M0,0 L500,0 L500,40 C350,150 200,30 0,100 Z" fill="var(--accent-1)" opacity="0.25"></path>
            <path d="M0,0 L500,0 L500,25 C320,130 180,10 0,80 Z" fill="var(--accent-2)" opacity="0.6"></path>
            <path d="M0,0 C150,90 350,-40 500,60 L500,0 Z" fill="var(--accent-1)" opacity="0.8"></path>
        </svg>
    </div>

    <div class="mb-1 text-center" style="margin-top:-14px;">
        <h1 style="font-family: 'Quicksand', sans-serif !important; font-weight:700; letter-spacing: -0.5px;"
            class="text-[24px] font-bold text-white mb-1">
            Sign In<span style="color:var(--accent-1);">.</span>
        </h1>
        <p id="progress-text"
           style="font-family: 'Quicksand', sans-serif !important; letter-spacing: -0.01em; color: var(--accent-1);"
           class="text-[13px] font-bold">
            Login to your account.
        </p>
    </div>

    <div id="form-container" class="space-y-2.5">
        <div id="step-1">
            <label class="orbitron text-gray-500 ml-1 mb-1 block">Username / Email</label>
            <input type="text" id="login-id" oninput="validateLogin()" class="input-node">
        </div>

        <div id="step-2">
            <div class="flex justify-between items-center ml-1 mb-1">
                <label class="orbitron text-gray-500 block">Access Password</label>
                <a href="#" onclick="forgotPassword()" style="color:var(--accent-1);" class="text-[11px] font-bold hover:underline">Forgot?</a>
            </div>
            <input type="password" id="login-pass" oninput="validateLogin()" class="input-node">
        </div>

        <button id="login-btn" onclick="login()" disabled class="w-full bg-white text-black py-4 rounded-2xl font-bold orbitron mt-2 opacity-20 cursor-not-allowed transition-all duration-500">SIGN IN</button>
    </div>

    <p style="font-family: 'Quicksand', sans-serif !important; letter-spacing: -0.01em;"
       class="text-[13px] text-gray-500 text-center mt-3">
        Not registered?
        <a href="signup.html" style="color:var(--accent-1);" class="font-bold hover:underline">Create account</a>
    </p>

    <script>
    // 1. Bayanan Hadin Gwiwa (Firebase Configuration)
    const firebaseConfig = {
        apiKey: "AIzaSyDLTwLq8Le9vYAwRkRcqXPGxFnEqW1yE2E",
        authDomain: "synergy-protocol.firebaseapp.com",
        projectId: "synergy-protocol",
        databaseURL: "https://synergy-protocol-default-rtdb.firebaseio.com"
    };

    // 2. Tada Tsarin (Initialize Firebase)
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const database = firebase.database();
    const auth = firebase.auth();

    // SAKA WANNAN GYARAN KAI TSAYE A KASA DA SHI:
    db.settings({
        experimentalForceLongPolling: true,
        cacheSizeBytes: firebase.firestore.CACHE_SIZE_UNLIMITED
    });

    let verifyCheckInterval = null;

    // Function na nuna sanarwa a sama (GitHub Style) - unified with signup page
    function showTopNotif(message, type) {
        const bar = document.getElementById('notification-bar');
        const msg = document.getElementById('notif-message');

        bar.className = (type === 'success') ? 'notif-success show' : 'notif-error show';
        msg.innerText = message;

        setTimeout(closeNotif, 5000);
    }

    function closeNotif() {
        document.getElementById('notification-bar').classList.remove('show');
    }

    function validateLogin() {
        const loginID = document.getElementById('login-id').value.trim();
        const loginPass = document.getElementById('login-pass').value.trim();
        const btn = document.getElementById('login-btn');

        if (loginID.length >= 3 && loginPass.length >= 6) {
            btn.disabled = false;
            btn.style.opacity = "1";
            btn.classList.remove('cursor-not-allowed');
        } else {
            btn.disabled = true;
            btn.style.opacity = "0.2";
            btn.classList.add('cursor-not-allowed');
        }
    }

    // LOGIN FUNCTION
    // Firestore (`users/{username}`) is now the reliable source for resolving
    // username -> email. Historically some RTDB `users/{username}` records are
    // missing the `email` field (written by an older signup flow), while
    // Firestore has been consistently complete, so we resolve from Firestore.
    //
    // Document IDs always match the `username` field exactly as it was
    // stored at signup time. Current signups always lowercase the username
    // (a-z0-9_ only), but some legacy accounts were created before that rule
    // and may contain "@" or mixed case — so we try the input exactly as
    // typed first, then fall back to the lowercased version.

    function looksLikeEmail(str) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(str);
    }

    async function findUserDocByUsername(rawInput) {
        const trimmed = rawInput.trim();
        let doc = await db.collection('users').doc(trimmed).get();
        if (doc.exists) return doc;

        const lower = trimmed.toLowerCase();
        if (lower !== trimmed) {
            doc = await db.collection('users').doc(lower).get();
            if (doc.exists) return doc;
        }
        return null;
    }

    async function findUsernameByUid(uid) {
        try {
            const q = await db.collection('users').where('uid', '==', uid).limit(1).get();
            if (!q.empty) return q.docs[0].id;
        } catch (err) {
            console.warn("Reverse username lookup failed:", err);
        }
        return null;
    }

    async function login() {
        const loginInput = document.getElementById('login-id').value.trim();
        const pass = document.getElementById('login-pass').value.trim();
        const btn = document.getElementById('login-btn');

        btn.innerHTML = `<span class="orbitron animate-pulse">CONNECTING...</span>`;
        btn.disabled = true;

        try {
            let email = loginInput;

            // 1. Nemo Email daga Username (Firestore — cikakken source yanzu)
            //    Amfani da looksLikeEmail maimakon includes('@') domin wasu
            //    tsofaffin usernames suna da "@" a cikinsu (misali "@yaafakhu7").
            if (!looksLikeEmail(loginInput)) {
                const userDoc = await findUserDocByUsername(loginInput);
                if (userDoc && userDoc.data().email) {
                    email = userDoc.data().email;
                } else if (userDoc) {
                    showTopNotif("This account is missing an email on file. Please contact support.", "error");
                    btn.innerText = "SIGN IN";
                    btn.disabled = false;
                    return;
                } else {
                    showTopNotif("We couldn't find an account with that username.", "error");
                    btn.innerText = "SIGN IN";
                    btn.disabled = false;
                    return;
                }
            }

            // 2. Tabbatar da Authentication (Firebase Auth)
            const userCredential = await auth.signInWithEmailAndPassword(email, pass);
            const user = userCredential.user;

            // 3. Duba Email Verification — if not verified, offer to resend
            //    and wait right here instead of dead-ending the person.
            if (!user.emailVerified) {
                btn.innerText = "SIGN IN";
                btn.disabled = false;
                showUnverifiedPrompt(user);
                return;
            }

            // 4. Nemo ainihin Username (Firestore reverse lookup — reliable
            //    whether the person typed their username or their email)
            const finalUsername = (await findUsernameByUid(user.uid)) || loginInput.toLowerCase();
            localStorage.setItem('synergy_user', finalUsername);

            // 5. Tura shi Wallet
            showTopNotif("Access Granted! Connecting...", "success");
            setTimeout(() => {
                window.location.href = "wallet.html";
            }, 1200);

        } catch (error) {
            console.error("Firebase Error:", error.code, error.message);
            if (error.code === "auth/user-not-found" || error.code === "auth/invalid-credential") {
                showTopNotif("Invalid credentials. Try again.", "error");
            } else if (error.code === "auth/wrong-password") {
                showTopNotif("Incorrect password.", "error");
            } else if (error.code === "auth/too-many-requests") {
                showTopNotif("Too many attempts. Please wait a moment and try again.", "error");
            } else {
                showTopNotif("Error: " + error.message, "error");
            }
            btn.innerText = "SIGN IN";
            btn.disabled = false;
        }
    }

    // Shown when credentials are correct but the email isn't verified yet —
    // gives a real way forward (resend + auto-detect) instead of a dead end,
    // no matter how long ago the person originally registered.
    function showUnverifiedPrompt(user) {
        Swal.fire({
            html: `
                <div class="flex flex-col items-center">
                    <h2 class="orbitron text-white text-lg mb-4">EMAIL NOT VERIFIED</h2>
                    <div style="background: rgba(255,255,255,0.03); padding: 22px; border-radius: 20px; border: 1px dashed rgba(167,139,250,0.3); width: 100%; color: #fff;">
                        <p style="font-family:'Quicksand',sans-serif; font-size:14px;">Please verify <b style="color:#a78bfa;">${user.email}</b> before signing in.</p>
                        <p class="animate-pulse" id="verify-wait-text" style="font-size: 11px; color: #3fb950; margin-top: 10px; font-family:'Quicksand',sans-serif; font-weight:700;">Waiting for verification...</p>
                    </div>
                </div>`,
            background: '#0d0f14',
            showConfirmButton: true,
            confirmButtonText: 'RESEND LINK',
            allowOutsideClick: true,
            customClass: { popup: 'rounded-[35px] border border-[#a78bfa]/30 shadow-2xl', confirmButton: 'resend-btn-neon orbitron' },
            didOpen: () => { startVerifyListener(user); },
            willClose: () => { if (verifyCheckInterval) clearInterval(verifyCheckInterval); }
        }).then((result) => {
            if (result.isConfirmed) {
                user.sendEmailVerification()
                    .then(() => showTopNotif("Verification link resent.", "success"))
                    .catch(() => showTopNotif("Please wait a moment before requesting another link.", "error"));
                showUnverifiedPrompt(user);
            }
        });
    }

    function startVerifyListener(user) {
        if (verifyCheckInterval) clearInterval(verifyCheckInterval);
        verifyCheckInterval = setInterval(async () => {
            await user.reload();
            if (user.emailVerified) {
                clearInterval(verifyCheckInterval);
                Swal.close();
                showTopNotif("Verified! Connecting...", "success");
                const finalUsername = await findUsernameByUid(user.uid);
                if (finalUsername) {
                    localStorage.setItem('synergy_user', finalUsername);
                }
                setTimeout(() => { window.location.href = "wallet.html"; }, 1200);
            }
        }, 3000);
    }

    function forgotPassword() {
        const prefill = document.getElementById('login-id').value.trim();
        Swal.fire({
            title: 'Reset Password',
            input: 'email',
            inputValue: prefill.includes('@') ? prefill : '',
            inputPlaceholder: 'Enter your registered email',
            background: '#0d0f14',
            color: '#fff',
            showCancelButton: true,
            confirmButtonText: 'SEND RESET LINK',
            customClass: { popup: 'rounded-[35px] border border-[#a78bfa]/30 shadow-2xl', confirmButton: 'resend-btn-neon orbitron' }
        }).then((result) => {
            if (result.isConfirmed && result.value) {
                auth.sendPasswordResetEmail(result.value)
                    .then(() => { showTopNotif("Password reset link sent!", "success"); })
                    .catch((error) => { showTopNotif("Error: " + error.message, "error"); });
            }
        });
    }
    </script>
</div>
</body>
</html>
