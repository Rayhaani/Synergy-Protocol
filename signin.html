<head>

    <style>
        :root { --aqua: #00f2fe; --purple: #7000ff; --bg: #020617; }
        body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    /* Wannan shi ne babban sirrin daskare shafi */
    overflow: hidden; 
    position: fixed;
    
    background-color: #020617;
    background-image: 
        radial-gradient(circle at 50% 50%, rgba(112, 0, 255, 0.15), transparent), 
        url('https://www.transparenttextures.com/patterns/carbon-fibre.png');

    color: #ffffff;

        }
        
      
        .glass-card { 
            background: rgba(255, 255, 255, 0.02); 
            backdrop-filter: blur(40px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-top: 1px solid rgba(0, 242, 254, 0.3);

        @keyframes reveal {
            from { opacity: 0; transform: translateY(20px); filter: blur(10px); }

        .input-glow:focus { 
            border-color: var(--aqua);

        .btn-locked { opacity: 0.2; cursor: not-allowed; filter: grayscale(1); }
   


        /* SYNERGY PROTOCOL - GLOBAL BACKGROUND ENGINE */
body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background-color: #020617; /* Deep Space Blue-Black */
    
    /* Wannan shi ne hadin Radial Gradient da Carbon Fibre Texture */
    background-image: 
        radial-gradient(circle at 50% 50%, rgba(112, 0, 255, 0.15), transparent), 
        url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
    
    /* Wannan zai sa background din ya tsaya wuri daya koda ana scrolling (Premium Feel) */

    color: #ffffff;

    overflow-x: hidden;
}

/* Kyautatawa: Karin haske ga Glassmorphism cards a kan wannan background din */
.glass-premium {
    background: rgba(255, 255, 255, 0.02);
    backdrop-filter: blur(40px) saturate(180%);

    border-top: 1px solid rgba(0, 242, 254, 0.3); /* Neon line a sama */
    border-radius: 24px;
}
    
    </style>
</head>
<body>

<div class="glass-card p-6 rounded-[30px] w-full max-w-md mx-4">


<div class="w-10 h-10 bg-cyan-500 rounded-full mx-auto mb-4 shadow-[0_0_15px_#00f2fe]"></div>

<h1 style="font-family: 'Syncopate', sans-serif !important; letter-spacing: -1px; text-align: center; text-transform: lowercase;" 
    class="text-[22px] font-bold text-white mb-1 w-full">
    Zynta<span class="text-cyan-400">.</span>
</h1>

<p id="progress-text" 
   style="font-family: 'Plus Jakarta Sans', sans-serif !important; letter-spacing: -0.01em; text-align: center;" 
   class="text-[15px] text-cyan-400 font-bold w-full mb-8">
    Login to your account
</p>
    
    
    
        
        <div id="form-container" class="space-y-3">
            <div id="step-1" class="step-visible">
                <label class="text-[9px] orbitron text-gray-400 ml-2 mb-1 block">Username / Email</label>
                <input type="text" id="login-id" oninput="validateLogin()" placeholder="Enter ID" 
                       class="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none input-glow transition-all text-white text-md">
            </div>

            <div id="step-2" class="step-hidden">
    <div class="flex justify-between items-center ml-2 mb-1">
        <label class="text-[9px] orbitron text-gray-400 block">Access Password</label>
        <a href="#" onclick="forgotPassword()" class="text-[10px] text-cyan-400 font-bold hover:underline">Forgot?</a>
    </div>
    <input type="password" id="login-pass" oninput="validateLogin()" placeholder="••••••••" 
           class="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none input-glow transition-all text-white text-md">
            </div>

        
            <button id="login-btn" onclick="login()" disabled 
                    class="btn-locked w-full bg-gradient-to-r from-cyan-400 to-blue-500 text-black py-4 rounded-xl font-bold orbitron text-[11px] mt-2 transition-all duration-500">
                ACCESS PROTOCOL
            </button>
        </div>


<div class="border-t border-white/5 my-6"></div>

<p style="font-family: 'Plus Jakarta Sans', sans-serif !important; letter-spacing: -0.01em;" 
   class="text-[14px] text-gray-500 text-center">
    Not registered? 
    <a href="signup.html" class="text-cyan-400 font-bold hover:underline ml-1">Create account</a>
</p>
    

        
    </div>

<script>
    let MasterTaskRepository = [];

    const firebaseConfig = {
        apiKey: "AIzaSyDLTwLq8Le9vYAwRkRcqXPGxFnEqW1yE2E",
        authDomain: "synergy-protocol.firebaseapp.com",
        databaseURL: "https://synergy-protocol-default-rtdb.firebaseio.com",
        projectId: "synergy-protocol",
        storageBucket: "synergy-protocol.firebasestorage.app",
        messagingSenderId: "179647543031",
        appId: "1:179647543031:web:388da8a36e1bbbb55d85f2"
    };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();

    // ✅ KEY DAIDAI - synergy_user, plain string
    function getCurrentUsername() {
        return localStorage.getItem('synergy_user') || null;
    }

    async function checkIfClaimed(taskId) {
        const username = getCurrentUsername();
        if (!username) return false;
        const today = new Date().toISOString().split('T')[0];
        try {
            const doc = await db.collection('task_claims').doc(`${username}_${taskId}_${today}`).get();
            return doc.exists;
        } catch (e) {
            return false;
        }
    }

    async function finishTask(id) {
        const task = MasterTaskRepository.find(t => t.id === id);
        const username = getCurrentUsername();

        if (!username) {
            alert("Da fari ka shiga account ɗinka!");
            window.location.href = 'index.html';
            return;
        }

        const today = new Date().toISOString().split('T')[0];
        const claimRef = db.collection('task_claims').doc(`${username}_${id}_${today}`);

        try {
            const existing = await claimRef.get();
            if (existing.exists) {
                alert("Ka riga ka yi wannan task yau! Sai gobe.");
                return;
            }

            await claimRef.set({
                username: username,
                taskId: id,
                taskTitle: task.title,
                reward: task.reward,
                date: today,
                claimedAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            await db.collection('users').doc(username).update({
                points: firebase.firestore.FieldValue.increment(task.reward)
            });

            alert(`Nasara! +${task.reward} pts an ƙara wa account ɗinka.`);
            location.reload();

        } catch (e) {
            console.error("finishTask error:", e);
            alert("Error: " + e.message);
        }
    }

    function deployTaskNode(id) {
        const selectedTask = MasterTaskRepository.find(t => t.id === id);
        const btn = event.currentTarget;

        window.open(selectedTask.link, '_blank');

        const startTime = Date.now();
        const targetSecs = 20;

        if (window.taskTimer) clearInterval(window.taskTimer);

        btn.disabled = true;
        btn.innerText = "Waiting...";

        window.taskTimer = setInterval(() => {
            if (document.visibilityState === 'hidden') return;

            const elapsed = Math.floor((Date.now() - startTime) / 1000);

            if (elapsed >= targetSecs) {
                clearInterval(window.taskTimer);
                btn.innerText = "CLAIM REWARD";
                btn.disabled = false;
                btn.style.background = '#00ff88';
                btn.style.color = '#000';
                btn.onclick = () => finishTask(id);
            } else {
                clearInterval(window.taskTimer);
                btn.innerText = "RESUME";
                btn.disabled = false;
                btn.style.background = '#ffffff';
                btn.style.color = '#000';
                btn.onclick = () => deployTaskNode(id);
            }
        }, 1000);
    }

    async function startSleekAggregator() {
        MasterTaskRepository = [];

        const techTitles = [
            "⚡ Activate Core Quantum Mining Node",
            "🛰️ Synchronize Satellite Data & Verify AI Sub-Network",
            "🌐 Decentralized Web3 Protocol Verification Check",
            "🧠 Train Neural Interface Model - Pattern Recognition",
            "🔐 Secure Quantum Ledger Authentication Validation",
            "💎 Shard Processing Node Verification Check",
            "🚀 Cloud Compute Optimisation Task (Beta Node)",
            "📊 Distributed Data Pipeline Structuring Process",
            "🧬 Validate Bio-Metric Encrypted Data Link",
            "🛡️ Cyber Security Firewall Penetration Log",
            "📡 Signal Uplink Stability Calibration",
            "🔋 Nano-Grid Energy Flow Optimization"
        ];

        for (let i = 1; i <= 12; i++) {
            MasterTaskRepository.push({
                id: `ad_node_${i}`,
                title: `[NODE-${1000 + i}] ${techTitles[(i - 1) % techTitles.length]}`,
                reward: parseFloat((0.10 + (i * 0.003)).toFixed(2)),
                slots: 'Continuous',
                link: 'https://fluffy-machine.com/o8laPe'
            });
        }

        await new Promise(r => setTimeout(r, 1000));
        await renderTaskMatrix();
    }

    async function renderTaskMatrix() {
        const target = document.getElementById('tasks-grid-target');
        target.innerHTML = '';

        for (const task of MasterTaskRepository) {
            const isClaimed = await checkIfClaimed(task.id);

            const btnHtml = isClaimed
                ? `<button disabled class="px-5 py-2 rounded-full bg-gray-700 text-gray-400 font-bold text-[10px] tracking-[1px] cursor-not-allowed" style="font-family: 'Syncopate', sans-serif;">DONE TODAY</button>`
                : `<button onclick="deployTaskNode('${task.id}')" class="px-5 py-2 rounded-full bg-white text-black font-bold text-[10px] tracking-[1px] hover:bg-cyan-400 transition-all duration-300 shadow-md" style="font-family: 'Syncopate', sans-serif;">DO TASK</button>`;

            target.insertAdjacentHTML('beforeend', `
                <div class="zynta-sleek-card rounded-2xl p-5 sm:p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div class="flex items-start gap-4 w-full">
                        <div class="w-2 h-2 rounded-full bg-cyan-400 mt-2 shrink-0"></div>
                        <div class="space-y-1 w-full">
                            <h3 class="text-[14px] font-medium text-gray-200 tracking-tight leading-snug text-justify w-full">${task.title}</h3>
                            <div class="flex items-center gap-3 text-[10px] text-gray-500 uppercase tracking-wider">
                                <span>Status: <span class="text-cyan-400">${task.slots}</span></span>
                            </div>
                        </div>
                    </div>
                    <div class="flex sm:flex-col items-center sm:items-end justify-between sm:justify-center border-t sm:border-t-0 border-white/[0.03] pt-3 sm:pt-0 shrink-0">
                        <span class="digits-terminal text-base text-[#00ff88] sm:mb-2">+${task.reward.toFixed(2)} pts</span>
                        ${btnHtml}
                    </div>
                </div>
            `);
        }

        document.getElementById('board-loader').classList.add('hidden');
        target.classList.remove('opacity-0');
    }

    window.onload = async () => {
        if (!getCurrentUsername()) {
            window.location.href = 'index.html';
            return;
        }
        await startSleekAggregator();
    };

    

    </script>
</body>
</html>
