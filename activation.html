    <style>
        :root { --aqua: #00f2fe; --bg: #010409; }
        body { 
            background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; 
            background-image: radial-gradient(circle at 50% 10%, rgba(112, 0, 255, 0.15), transparent), url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
            min-height: 100vh; margin: 0; padding: 0;
        }
        .icon-circle { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.03); border: 2px solid rgba(255, 255, 255, 0.1); transition: all 0.5s ease; }
        .breathing { animation: breathe 2s infinite ease-in-out; border-color: var(--aqua) !important; }
        @keyframes breathe { 0%, 100% { transform: scale(1); box-shadow: 0 0 10px rgba(0, 242, 254, 0.2); } 50% { transform: scale(1.08); box-shadow: 0 0 20px rgba(0, 242, 254, 0.5); } }
        .btn-task { background: #fff; color: #000; font-size: 11px; font-weight: 800; width: 100px; height: 40px; border-radius: 10px; text-transform: uppercase; transition: all 0.3s; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; }
        .btn-task:disabled { background: #fff; opacity: 0.3; color: #000; cursor: not-allowed; }
        .btn-upload { background: var(--aqua) !important; color: #000 !important; }
        .btn-completed { background: rgba(0, 242, 254, 0.1) !important; color: var(--aqua) !important; border: 1px solid var(--aqua); cursor: default; }
        .social-row { padding: 15px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); display: flex; align-items: center; justify-content: space-between; }
        .platform-name { font-size: 13px; font-weight: 700; color: #e2e8f0; }
        input[type="file"] { display: none; }
   
    .review-box {
    background: rgba(0, 242, 254, 0.05);
    border: 1px dashed rgba(0, 242, 254, 0.3);
    border-radius: 15px;
    padding: 20px;
    margin-top: 20px;
    display: none; /* Da farko a boye yake */
    flex-direction: column;
    align-items: center;
    animation: fadeIn 0.8s ease-out;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

  .loader-orbit {
    width: 50px;
    height: 50px;
    border: 3px solid rgba(0, 242, 254, 0.1); /* Dan haske a jiki */
    border-top: 3px solid var(--aqua);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    position: relative;
    /* Wannan shi ne Glow Effect din */
    box-shadow: 0 0 15px rgba(0, 242, 254, 0.3); 
}

/* Wannan zai kara wani dan circle a ciki mai bugawa (pulse) */
.loader-orbit::before {
    content: '';
    position: absolute;
    inset: 8px;
    border: 2px solid rgba(112, 0, 255, 0.3);
    border-radius: 50%;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% { transform: scale(0.8); opacity: 0.5; }
    50% { transform: scale(1.1); opacity: 1; }
    100% { transform: scale(0.8); opacity: 0.5; }
}

    <script>

        // 1. Wannan shi ne madaidaicin saiti don magance matsalar S3
const s3 = new AWS.S3({
    accessKeyId: 'jvu3nxyqugtsfvmh7sriztfu6sta', 
    secretAccessKey: 'jzpivdjr6g2wuedfpr42xj3zijivaa36imk6pqnwugnomreyv6q3c', 
    endpoint: 'https://gateway.storjshare.io', // Maimakon s3.eu1, bari mu koma asalin Gateway
    s3ForcePathStyle: true,
    signatureVersion: 'v4',
    region: 'eu-1'
});

  
        // Wannan zai nuna maka abin da ke cikin kowane mabuɗi
        const firebaseConfig = {
            apiKey: "AIzaSyDLTwLq8Le9vYAwRkRcqXPGxFnEqW1yE2E",
            authDomain: "synergy-protocol.firebaseapp.com",
            projectId: "synergy-protocol",
            appId: "1:179647543031:web:388da8a36e1bbbb55d85f2"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Cloudinary Settings (Daga screenshot dinka)
const CLOUDINARY_URL = 'https://api.cloudinary.com/v1_1/diixjieyp/image/upload';
const CLOUDINARY_UPLOAD_PRESET = 'zynta_present'; 
        
        function handleAction(id, link) {
            const btn = document.getElementById('btn-' + id);
            window.open(link, '_blank');
            setTimeout(() => {
                btn.innerText = "Upload";
                btn.classList.add('btn-upload');
                btn.setAttribute('onclick', `triggerFileSelect(${id})`);
            }, 2000);
        }

        function triggerFileSelect(id) {
            document.getElementById('file-' + id).click();
        }

    

async function handleUpload(id, successText) {
    const fileInput = document.getElementById('file-' + id);
    const btn = document.getElementById('btn-' + id);
    const platformName = document.querySelector(`#row-${id} .platform-name`).innerText;
    const currentUsername = localStorage.getItem('synergy_user');

    if (fileInput.files && fileInput.files[0]) {
        const file = fileInput.files[0];
        btn.innerText = "Wait...";
        btn.disabled = true;

        try {
            const fileName = `uploads/${currentUsername}/${Date.now()}-${file.name.replace(/\s+/g, '_')}`;

            const params = {
                Bucket: 'zynta-media',
                Key: fileName,
                Body: file,
                ContentType: file.type,
                // MU COGE ACL: 'public-read' ANAN DON SAMUN NASARA
            };

            // Tura hoton zuwa Storj
            const upload = await s3.upload(params).promise();
            
            // Wannan link din zai sa hoton ya fito garau ga Admin
            const imageUrl = `https://link.storjshare.io/raw/jvu3nxyqugtsfvmh7sriztfu6sta/zynta-media/${fileName}`;

            // 2. AJIYE A FIREBASE
            await db.collection("task_submissions").add({
                username: currentUsername,
                platform: platformName,
                imageUrl: imageUrl, 
                submittedAt: firebase.firestore.FieldValue.serverTimestamp(),
                status: "pending"
            });

            // UI UPDATES (Kamar yadda suke a mastercode dinka)
            btn.innerText = successText;
            btn.classList.remove('btn-upload');
            btn.classList.add('btn-completed');
            btn.removeAttribute('onclick');
            document.getElementById('circle-' + id).classList.remove('breathing');

            const nextId = id + 1;
            const nextBtn = document.getElementById('btn-' + nextId);
            if (nextBtn) {
                nextBtn.disabled = false;
                document.getElementById('circle-' + nextId).classList.add('breathing');
            } else {
                document.getElementById('task-container').style.display = 'none';
                document.getElementById('review-section').style.display = 'flex';
            }

            alert("Uploaded Successfully!");

        } catch (error) {
            console.error("Takamaiman Matsalar:", error);
            // Idan ya nuna Forbidden, duba idan Bucket dinka sunansa "zynta-media" ne daidai
            alert("Kuskure ya faru: " + error.message);
            btn.innerText = "Upload";
            btn.disabled = false;
        }
    }
}
        


        // Wannan zai tabbatar record bai goge ba idan an yi refresh

        function monitorApproval() {
    const userKey = localStorage.getItem('synergy_user');
    if (!userKey) return;

    db.collection("task_submissions")
        .where("username", "==", userKey)
        .onSnapshot((snapshot) => {
            if (snapshot.empty) return;

            let isApprovedByAdmin = false;
            let submittedCount = snapshot.size;

            snapshot.forEach(doc => {
                if (doc.data().status === "approved") {
                    isApprovedByAdmin = true;
                }
            });

            // 1. Idan Admin ya amince
            if (isApprovedByAdmin) {
                window.location.href = "dashboard.html";
                return;
            }

            // 2. Idan mutum ya gama tura duka hotuna 5 (ko fiye)
            if (submittedCount >= 5) {
                document.getElementById('task-container').style.display = 'none';
                document.getElementById('review-section').style.display = 'flex';
            }
        });
}

// KIRA SHI NAN TAKE
monitorApproval();
        
    </script>
