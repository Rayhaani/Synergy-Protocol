<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Support — Million Subscribers</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#020617; --surface:#050a15; --surface2:#0a0f1e; --surface3:#111827;
  --border:#222840; --border2:#2C3450;
  --accent-1:#a78bfa; --accent-1-dim:rgba(167,139,250,.12);
  --accent-2:#f472b6;
  --amber:#FFB800;
  --red:#FF4C6A;
  --text:#EEEAE0; --text2:#8A91AD; --text3:#3E4460;
  --radius-sm:10px; --radius:16px;
  --font-b:'Quicksand',sans-serif;
  --ease:cubic-bezier(.22,.68,0,1.2);
}
html,body{height:100%}
body{
  margin:0; font-family:var(--font-b); color:var(--text); background:var(--bg);
  background-image:radial-gradient(circle at 50% 0%, rgba(112,0,255,.12), transparent 60%),
    url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
  -webkit-font-smoothing:antialiased; display:flex; flex-direction:column;
}
button,input{font-family:inherit;font-size:inherit;border:none;outline:none;background:none}
button{cursor:pointer}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}

#app{max-width:520px;margin:0 auto;width:100%;height:100vh;display:flex;flex-direction:column}

#header{
  padding:16px 20px 14px; text-align:center;
  border-bottom:1px solid rgba(255,255,255,.06);
  background:rgba(2,6,23,.97); backdrop-filter:blur(20px) saturate(160%);
  flex-shrink:0;
}
.header-top{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:4px}
.brand-dot{width:10px;height:10px;border-radius:50%;background:var(--accent-1)}
.app-title{font-family:var(--font-b);font-size:16px;font-weight:700;color:#fff}
.app-sub{font-size:10px;color:var(--text3);letter-spacing:.5px;text-transform:uppercase}
.status-live{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--accent-2);margin-top:6px}
.status-live .dot{width:6px;height:6px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 6px var(--accent-2)}

#chatMessages{
  flex:1; overflow-y:auto; padding:18px 18px 8px; display:flex; flex-direction:column; gap:10px;
}
.msg{max-width:80%;padding:11px 14px;font-size:13px;line-height:1.55;border-radius:15px}
.msg-member{align-self:flex-end;background:var(--accent-1-dim);border:1px solid rgba(167,139,250,.3);color:var(--text);border-bottom-right-radius:3px}
.msg-admin{align-self:flex-start;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-bottom-left-radius:3px}
.msg-time{display:block;font-size:8.5px;color:var(--text3);margin-top:4px}
.msg.pending{opacity:.6}

.msg-image{
  display:block; max-width:100%; border-radius:10px; margin-bottom:6px;
  cursor:pointer;
}
.msg-image:hover{ opacity:.92; }

#emptyChat{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:8px;text-align:center;padding:30px}
#emptyChat .e-icon{font-size:38px;opacity:.35}
#emptyChat h3{font-family:var(--font-b);font-size:14px;color:var(--text2);margin:0}
#emptyChat p{font-size:12px;color:var(--text3);margin:0;line-height:1.6}

/* ===== staged image preview (before sending) ===== */
#imagePreviewBar{
  display:none; align-items:center; gap:10px; padding:10px 16px;
  background:rgba(2,6,23,.97); border-top:1px solid var(--border);
  flex-shrink:0;
}
#imagePreviewBar.active{display:flex}
#imagePreviewThumb{
  width:52px;height:52px;border-radius:10px;object-fit:cover;
  border:1px solid rgba(167,139,250,.3); flex-shrink:0;
}
#imagePreviewInfo{flex:1;min-width:0}
#imagePreviewInfo p{margin:0;font-size:11px;color:var(--text2)}
#imagePreviewInfo span{font-size:10px;color:var(--text3)}
#removeImageBtn{
  width:30px;height:30px;border-radius:50%;flex-shrink:0;
  background:rgba(255,76,106,.12);border:1px solid rgba(255,76,106,.3);
  display:flex;align-items:center;justify-content:center;color:var(--red);
  transition:background .15s ease;
}
#removeImageBtn:hover{background:rgba(255,76,106,.2)}
#removeImageBtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.3}

.chat-input-row{
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border); background:rgba(2,6,23,.97); backdrop-filter:blur(20px);
  display:flex; gap:8px; flex-shrink:0; align-items:center;
}
.icon-btn{
  width:44px;height:44px;flex-shrink:0;border-radius:var(--radius-sm);
  background:var(--surface2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;color:var(--text2);
  transition:all .15s ease;
}
.icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2}
.icon-btn:hover{background:var(--surface3);color:var(--accent-1);border-color:rgba(167,139,250,.3)}
.icon-btn:active{transform:scale(.94)}
.icon-btn.has-image{background:var(--accent-1-dim);color:var(--accent-1);border-color:rgba(167,139,250,.4)}
#chatInput{
  flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:12px 15px;color:var(--text);font-size:13px;
}
#chatInput::placeholder{color:var(--text3)}
#sendBtn{
  background:var(--accent-1);color:var(--bg);padding:12px 20px;border-radius:var(--radius-sm);
  font-weight:700;font-size:12px;flex-shrink:0;transition:transform .15s var(--ease);
}
#sendBtn:active{transform:scale(.96)}
#sendBtn:disabled{background:var(--surface2);color:var(--text3)}

/* image lightbox */
#imgLightbox{
  display:none; position:fixed; inset:0; background:rgba(0,0,0,.85);
  z-index:999999; align-items:center; justify-content:center; padding:20px;
  backdrop-filter:blur(6px);
}
#imgLightbox.active{display:flex}
#imgLightbox img{max-width:100%; max-height:90vh; border-radius:12px}

/* error toast */
#errToast{
  position:fixed; top:-100px; left:50%; transform:translateX(-50%);
  background:var(--surface2); border:1px solid rgba(255,76,106,.4); color:#fff;
  padding:11px 20px; border-radius:14px; font-size:12px; font-weight:700;
  z-index:9999999; transition:top .4s var(--ease); max-width:90%; text-align:center;
}
#errToast.show{top:16px}
</style>
</head>
<body>
<div id="app">

  <header id="header">
    <div class="header-top">
      <span class="brand-dot"></span>
      <div class="app-title">Support</div>
    </div>
    <div class="app-sub">We usually reply within minutes</div>
    <div class="status-live"><span class="dot"></span> Agent online</div>
  </header>

  <div id="chatMessages"></div>

  <div id="emptyChat" style="display:none">
    <div class="e-icon">💬</div>
    <h3>Start the conversation</h3>
    <p>Tell us what's going on and our team will respond shortly.</p>
  </div>

  <div id="imagePreviewBar">
    <img id="imagePreviewThumb" src="" alt=""/>
    <div id="imagePreviewInfo">
      <p>Photo attached</p>
      <span>Add a caption below, or just hit Send</span>
    </div>
    <button id="removeImageBtn" onclick="removePendingImage()" title="Remove photo">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
  </div>

  <div class="chat-input-row">
    <button id="galleryBtn" class="icon-btn" onclick="document.getElementById('imageInput').click()" title="Attach photo">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="M21 15l-5-5L5 21"></path></svg>
    </button>
    <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="handleImageSelect(event)"/>
    <input type="text" id="chatInput" placeholder="Type your message…" onkeydown="if(event.key==='Enter')sendMemberMessage()"/>
    <button id="sendBtn" onclick="sendMemberMessage()">Send</button>
  </div>

</div>

<div id="imgLightbox" onclick="closeLightbox()">
  <img id="imgLightboxSrc" src="" alt=""/>
</div>

<div id="errToast"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDLTwLq8Le9vYAwRkRcqXPGxFnEqW1yE2E",
  authDomain: "synergy-protocol.firebaseapp.com",
  databaseURL: "https://synergy-protocol-default-rtdb.firebaseio.com",
  projectId: "synergy-protocol",
  storageBucket: "synergy-protocol.firebasestorage.app",
  messagingSenderId: "179647543031",
  appId: "1:179647543031:web:388da8a36e1bbbb55d85f2"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const THREADS_COL = "mc_support_threads";

// Same auth pattern as auth.html — username stored in localStorage after login
const username = localStorage.getItem('synergy_user');
if(!username){
  window.location.href = 'auth.html';
}

const currentUser = { uid: username, name: username };
const threadRef = db.collection(THREADS_COL).doc(currentUser.uid);

let pendingImage = null;          // base64 of a staged (not-yet-sent) photo
let localPending = [];            // messages sent locally, not yet confirmed by Firestore
let lastServerMessages = [];      // last known list of confirmed messages from Firestore

async function ensureThread(){
  try{
    const snap = await threadRef.get();
    if(!snap.exists){
      await threadRef.set({
        memberName: currentUser.name,
        memberUid: currentUser.uid,
        status: 'open',
        lastMessage: '',
        lastMessageAt: firebase.firestore.FieldValue.serverTimestamp(),
        unreadByAdmin: false,
        unreadByMember: false
      });
    }
  } catch(err){
    console.error(err);
    showError("Couldn't connect to support. Check your connection.");
  }
}
ensureThread();

function showError(msg){
  const t = document.getElementById('errToast');
  t.innerText = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3500);
}

function formatTime(ts){
  if(!ts) return "sending…";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
}

function timeSort(m){
  if(m.createdAt && m.createdAt.toDate) return m.createdAt.toDate().getTime();
  if(m.createdAt instanceof Date) return m.createdAt.getTime();
  return Date.now();
}

function renderMessages(){
  // once a locally-sent message is confirmed by Firestore (matched by clientTempId), drop the local copy
  const confirmedTempIds = new Set(lastServerMessages.map(m=>m.clientTempId).filter(Boolean));
  localPending = localPending.filter(p => !confirmedTempIds.has(p.clientTempId));

  const all = [...lastServerMessages, ...localPending].sort((a,b)=>timeSort(a)-timeSort(b));

  const box = document.getElementById('chatMessages');
  const empty = document.getElementById('emptyChat');

  if(all.length===0){
    box.style.display='none';
    empty.style.display='flex';
    return;
  }
  box.style.display='flex';
  empty.style.display='none';

  box.innerHTML = all.map(m=>`
    <div class="msg ${m.senderRole==='member'?'msg-member':'msg-admin'} ${m.pending?'pending':''}">
      ${m.image ? `<img src="${m.image}" class="msg-image" onclick="openLightbox(this.src)"/>` : ''}
      ${m.text ? m.text : ''}
      <span class="msg-time">${m.pending ? 'sending…' : formatTime(m.createdAt)}</span>
    </div>
  `).join('');
  box.scrollTop = box.scrollHeight;
}

threadRef.collection("messages").orderBy("createdAt","asc").onSnapshot(snap=>{
  lastServerMessages = snap.docs.map(d=>d.data());
  renderMessages();
  threadRef.update({ unreadByMember:false }).catch(()=>{});
}, err=>{
  console.error(err);
  showError("Couldn't load messages. Check your connection.");
});

async function sendMemberMessage(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();

  if(!text && !pendingImage) return; // nothing to send

  const tempId = 'tmp_' + Date.now() + '_' + Math.random().toString(36).slice(2);
  const payload = {
    senderRole:'member',
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    clientTempId: tempId
  };
  if(text) payload.text = text;
  if(pendingImage) payload.image = pendingImage;

  // 1. show it in the chat immediately (optimistic UI) so it never appears to "vanish"
  localPending.push({ ...payload, pending:true, createdAt: new Date() });
  renderMessages();

  // 2. reset the input + staged image right away
  input.value = '';
  const imageWasStaged = !!pendingImage;
  removePendingImage(false);

  // 3. actually write it to Firestore
  try{
    await threadRef.collection("messages").add(payload);
    await threadRef.update({
      lastMessage: text ? text : '📷 Photo',
      lastMessageAt: firebase.firestore.FieldValue.serverTimestamp(),
      unreadByAdmin:true,
      memberName: currentUser.name
    });
  } catch(err){
    console.error(err);
    // remove the failed optimistic bubble and let the member know
    localPending = localPending.filter(m => m.clientTempId !== tempId);
    renderMessages();
    showError("Message failed to send. Please try again.");
    if(imageWasStaged){
      // restore the image attachment so they don't have to reselect it
      pendingImage = payload.image;
      showPendingImagePreview(payload.image);
    }
    if(text) input.value = text;
  }
}

function handleImageSelect(event){
  const file = event.target.files[0];
  if(!file) return;

  if(!file.type.startsWith('image/')){
    showError("Please select an image file.");
    event.target.value = '';
    return;
  }

  const reader = new FileReader();
  reader.onload = (e) => {
    pendingImage = e.target.result;
    showPendingImagePreview(pendingImage);
  };
  reader.onerror = () => showError("Couldn't read that image, try another.");
  reader.readAsDataURL(file);
  event.target.value = '';
}

function showPendingImagePreview(src){
  document.getElementById('imagePreviewThumb').src = src;
  document.getElementById('imagePreviewBar').classList.add('active');
  document.getElementById('galleryBtn').classList.add('has-image');
}

function removePendingImage(refocus = true){
  pendingImage = null;
  document.getElementById('imagePreviewBar').classList.remove('active');
  document.getElementById('imagePreviewThumb').src = '';
  document.getElementById('galleryBtn').classList.remove('has-image');
  if(refocus) document.getElementById('chatInput').focus();
}

function openLightbox(src){
  document.getElementById('imgLightboxSrc').src = src;
  document.getElementById('imgLightbox').classList.add('active');
}
function closeLightbox(){
  document.getElementById('imgLightbox').classList.remove('active');
}
</script>
</body>
</html>
