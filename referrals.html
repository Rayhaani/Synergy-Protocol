<!DOCTYPE html>
<html lang="ha">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referrals | Synergy Protocol</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg: #0d0f14;
            --surface: #161922;
            --surface-2: #1c202b;
            --border: rgba(255,255,255,0.08);
            --text-dim: #8b90a0;
            --accent-1: #a78bfa;
            --accent-2: #f472b6;
        }

        * { box-sizing: border-box; }

        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Quicksand', sans-serif;
            font-weight: 500;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 40px;
            background-image: radial-gradient(circle at 50% 50%, rgba(112, 0, 255, 0.15), transparent), url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
        }

        h1, h2, h3, h4 { font-family: 'Quicksand', sans-serif; }

        .back-btn {
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: var(--surface);
            border: 1px solid var(--border);
            transition: all 0.2s ease;
        }
        .back-btn:hover { background: var(--surface-2); }

        /* ===== HERO ===== */
        .hero-icon {
            width: 68px; height: 68px; border-radius: 22px;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 12px 30px rgba(167, 139, 250, 0.25);
        }

        .headline {
            font-size: 26px;
            font-weight: 700;
            line-height: 1.25;
            letter-spacing: -0.3px;
        }

        .subcopy {
            color: var(--text-dim);
            font-size: 14px;
            font-weight: 500;
            line-height: 1.5;
        }

        /* ===== SHARE CARD ===== */
        .share-card {
            background: linear-gradient(160deg, rgba(167,139,250,0.14), rgba(244,114,182,0.06));
            border: 1px solid rgba(167,139,250,0.25);
            border-radius: 28px;
        }

        .code-pill {
            background: rgba(0,0,0,0.25);
            border: 1px dashed rgba(255,255,255,0.18);
            border-radius: 18px;
        }
        .code-pill input {
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.3px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            color: #0d0f14;
            font-weight: 700;
            transition: all 0.2s ease;
        }
        .btn-primary:active { transform: scale(0.98); }

        .btn-secondary {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            color: #fff;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); }

        /* ===== STATS ===== */
        .stat-chip {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
        }
        .stat-num {
            font-size: 24px;
            font-weight: 700;
        }
        .stat-tag {
            font-size: 11.5px;
            color: var(--text-dim);
            font-weight: 600;
        }

        /* ===== FRIENDS LIST ===== */
        .list-heading {
            font-size: 15px;
            font-weight: 700;
        }
        .list-sub {
            font-size: 12px;
            color: var(--text-dim);
            font-weight: 500;
        }

        .friend-row {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            transition: all 0.15s ease;
        }
        .friend-row:active { background: var(--surface-2); }

        .avatar {
            width: 42px; height: 42px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 15px;
            background: linear-gradient(135deg, rgba(167,139,250,0.25), rgba(244,114,182,0.2));
            color: #e9d5ff;
        }

        .friend-name { font-weight: 700; font-size: 14px; }
        .friend-meta { font-size: 11.5px; color: var(--text-dim); font-weight: 500; }

        .badge {
            font-size: 10.5px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .badge-active { background: rgba(74,222,128,0.12); color: #4ade80; }
        .badge-inactive { background: rgba(139,144,160,0.12); color: var(--text-dim); }
        .badge-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-dim);
        }

        /* ===== TOAST ===== */
        .synergy-toast {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            background: var(--surface-2);
            border: 1px solid rgba(167,139,250,0.4);
            color: white; padding: 12px 24px;
            border-radius: 16px; z-index: 9999;
            transition: all 0.5s cubic-bezier(0.19,1,0.22,1);
            font-family: 'Quicksand', sans-serif; font-size: 13px; font-weight: 700;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .synergy-toast.show { top: 24px; }

        /* ===== BOTTOM SHEET MODAL ===== */
        .sheet-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 20000;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .sheet-overlay.active { opacity: 1; pointer-events: auto; }

        .friend-sheet {
            position: fixed;
            left: 50%; bottom: 0;
            transform: translate(-50%, 100%);
            width: min(94%, 460px);
            z-index: 20001;
            background: var(--surface);
            border: 1px solid var(--border);
            border-bottom: none;
            border-radius: 28px 28px 0 0;
            padding: 10px 22px calc(26px + env(safe-area-inset-bottom)) 22px;
            transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
        }
        .friend-sheet.active { transform: translate(-50%, 0); }

        .sheet-handle {
            width: 36px; height: 4px;
            background: rgba(255,255,255,0.15);
            border-radius: 10px;
            margin: 8px auto 18px auto;
        }

        .sheet-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-bottom: 1px solid var(--border);
            font-size: 13px;
        }
        .sheet-row:last-of-type { border-bottom: none; }
        .sheet-row span:first-child { color: var(--text-dim); font-weight: 600; }
        .sheet-row span:last-child { font-weight: 700; }
    </style>
</head>
<body>

<main class="max-w-md mx-auto px-5 pt-6 space-y-7">

    <button class="back-btn" onclick="history.back()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>

    <!-- HERO -->
    <section class="text-center space-y-4 pt-2">
        <div class="hero-icon mx-auto">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#0d0f14" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
        </div>
        <h1 class="headline">Invite friends,<br>earn together</h1>
        <p class="subcopy px-4">Share your link. When a friend joins and stays active, you both benefit.</p>
    </section>

    <!-- SHARE CARD -->
    <section class="share-card p-5 space-y-4">
        <p class="text-[12px] font-bold" style="color: var(--accent-1);">Your referral link</p>
        <div class="code-pill flex items-center px-4 py-3.5">
            <input type="text" id="ref-link" readonly value="Loading..." class="bg-transparent w-full outline-none text-white">
        </div>
        <div class="flex gap-2.5">
            <button onclick="copyRef()" class="btn-secondary flex-1 py-3 rounded-2xl text-[13px] flex items-center justify-center gap-2">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                Copy
            </button>
            <button onclick="shareRef()" class="btn-primary flex-1 py-3 rounded-2xl text-[13px] flex items-center justify-center gap-2">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0d0f14" stroke-width="2.3"><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"></path><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle></svg>
                Share
            </button>
        </div>
    </section>

    <!-- STATS -->
    <section class="grid grid-cols-2 gap-3">
        <div class="stat-chip p-4 text-center">
            <p id="ref-count" class="stat-num">0</p>
            <p class="stat-tag mt-1">Invited</p>
        </div>
        <div class="stat-chip p-4 text-center">
            <p id="active-count-top" class="stat-num" style="color:#4ade80;">0</p>
            <p class="stat-tag mt-1">Active now</p>
        </div>
    </section>

    <!-- FRIENDS LIST -->
    <section class="space-y-3">
        <div>
            <p class="list-heading">Your invites</p>
            <p class="list-sub">Tap a friend to see details</p>
        </div>
        <div id="referral-list-body" class="space-y-2.5">
            <p class="empty-state text-[13px]">Loading your invites…</p>
        </div>
    </section>

</main>

<!-- FRIEND DETAIL BOTTOM SHEET -->
<div id="sheetOverlay" class="sheet-overlay" onclick="closeModal()"></div>
<div id="customNodeModal" class="friend-sheet">
    <div class="sheet-handle"></div>
    <div class="flex items-center gap-3 mb-5">
        <div id="modalAvatar" class="avatar">?</div>
        <div>
            <p id="modalName" class="friend-name text-[16px]">—</p>
            <p id="modalUser" class="friend-meta" style="color: var(--accent-1);">@—</p>
        </div>
    </div>

    <div id="modalBody" class="mb-6"></div>

    <div class="flex gap-3">
        <button id="closeBtn" class="btn-secondary flex-1 py-3.5 rounded-2xl text-[13px]">Close</button>
        <button id="waBtn" class="btn-primary flex-1 py-3.5 rounded-2xl text-[13px]">Message on WhatsApp</button>
    </div>
</div>

<script>
    // 1. INITIALIZE FIREBASE
    const firebaseConfig = {
        apiKey: "AIzaSyDLTwLq8Le9vYAwRkRcqXPGxFnEqW1yE2E",
        authDomain: "synergy-protocol.firebaseapp.com",
        projectId: "synergy-protocol",
        databaseURL: "https://synergy-protocol-default-rtdb.firebaseio.com",
        storageBucket: "synergy-protocol.firebasestorage.app",
        messagingSenderId: "179647543031",
        appId: "1:179647543031:web:388da8a36e1bbbb55d85f2"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }

    const db = firebase.firestore();
    const database = firebase.database();

    // 2. AUTH & LINK GENERATION
    firebase.auth().onAuthStateChanged((user) => {
        if (user) {
            db.collection("users").where("email", "==", user.email).get().then((querySnapshot) => {
                if (querySnapshot.empty) {
                    document.getElementById('ref-link').value = "Profile not found";
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const myUsername = doc.data().username;
                    const refInput = document.getElementById('ref-link');
                    const baseUrl = "https://zynta.org/signup.html";

                    if (refInput) {
                        refInput.value = `${baseUrl}?ref=${myUsername}`;
                    }

                    loadReferralNetwork(myUsername);
                });
            }).catch(err => console.error("Error fetching user:", err));
        } else {
            window.location.href = "signin.html";
        }
    });

    // 3. LOAD REFERRAL NETWORK
    function loadReferralNetwork(currentUsername) {
        const listBody = document.getElementById('referral-list-body');
        const topActiveCount = document.getElementById('active-count-top');
        const refCountHeader = document.getElementById('ref-count');

        db.collection("users").where("referredBy", "==", currentUsername)
        .onSnapshot((querySnapshot) => {
            listBody.innerHTML = "";
            let activeCount = 0;
            let totalRefs = 0;

            if (querySnapshot.empty) {
                listBody.innerHTML = `
                    <div class="empty-state">
                        <p class="text-[13px] font-semibold">No invites yet</p>
                        <p class="text-[12px] mt-1">Share your link above to get started</p>
                    </div>`;
                topActiveCount.innerText = "0";
                refCountHeader.innerText = "0";
                return;
            }

            const today = new Date().toLocaleDateString('en-GB');

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                totalRefs++;

                const lastDate = data.lastActivityDate || "N/A";
                const isActive = (lastDate === today);
                if (isActive) activeCount++;

                const displayName = data.username.charAt(0).toUpperCase() + data.username.slice(1).toLowerCase();
                const initial = data.username.charAt(0).toUpperCase();

                listBody.innerHTML += `
                    <div class="friend-row flex items-center gap-3 p-3.5 cursor-pointer"
                        onclick="openNodeVault('${data.fullName || 'N/A'}', '${data.username}', '${data.phoneNumber || ''}', '${data.email || 'N/A'}', '${(data.videoBalance || 0) + (data.shareBalance || 0)}')">
                        <div class="avatar">${initial}</div>
                        <div class="flex-1 min-w-0">
                            <p class="friend-name truncate">@${displayName}</p>
                            <p class="friend-meta">${data.lastActivityDate || 'Never active'}</p>
                        </div>
                        <span class="badge ${isActive ? 'badge-active' : 'badge-inactive'}">
                            <span class="badge-dot"></span>${isActive ? 'Active' : 'Inactive'}
                        </span>
                    </div>`;
            });

            topActiveCount.innerText = activeCount;
            refCountHeader.innerText = totalRefs;
        });
    }

    function openNodeVault(fullName, username, phone, email, balance) {
        let cleanPhone = String(phone).replace(/\D/g, '');
        if (cleanPhone.startsWith('0')) {
            cleanPhone = '234' + cleanPhone.substring(1);
        }

        const overlay = document.getElementById('sheetOverlay');
        const modal = document.getElementById('customNodeModal');
        const modalBody = document.getElementById('modalBody');
        const modalAvatar = document.getElementById('modalAvatar');
        const modalName = document.getElementById('modalName');
        const modalUser = document.getElementById('modalUser');
        const waBtn = document.getElementById('waBtn');
        const closeBtn = document.getElementById('closeBtn');

        modalAvatar.innerText = username.charAt(0).toUpperCase();
        modalName.innerText = fullName;
        modalUser.innerText = `@${username}`;

        modalBody.innerHTML = `
            <div class="sheet-row"><span>Email</span><span>${email}</span></div>
            <div class="sheet-row"><span>Total earnings</span><span style="color:#4ade80;">₦${parseInt(balance).toLocaleString()}</span></div>
        `;

        waBtn.onclick = function() {
            if (cleanPhone) {
                window.open(`https://wa.me/${cleanPhone}`, '_blank');
            }
        };

        closeBtn.onclick = function() {
            closeModal();
        };

        overlay.classList.add('active');
        modal.classList.add('active');
    }

    function closeModal() {
        document.getElementById('sheetOverlay').classList.remove('active');
        document.getElementById('customNodeModal').classList.remove('active');
    }

    // 4. COPY & SHARE
    function copyRef() {
        const copyText = document.getElementById("ref-link");
        if (copyText.value === "Loading...") return;
        copyText.select();
        navigator.clipboard.writeText(copyText.value).then(() => showToast("Link copied"));
    }

    function shareRef() {
        const link = document.getElementById("ref-link").value;
        if (link === "Loading...") return;
        if (navigator.share) {
            navigator.share({ title: 'Join me on Synergy Protocol', url: link }).catch(() => {});
        } else {
            copyRef();
        }
    }

    function showToast(msg) {
        let toast = document.getElementById('synergy-toast') || document.createElement('div');
        toast.id = 'synergy-toast';
        toast.className = 'synergy-toast';
        document.body.appendChild(toast);
        toast.innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }
</script>

<script src="app.js"></script>
</body>
                  </html>
